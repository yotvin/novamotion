<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>NovaMotion Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#f0f0f0;font-family:'Segoe UI',Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* HEADER */
header{height:50px;background:#161616;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;gap:10px;padding:0 14px;flex-shrink:0}
header h1{font-size:15px;font-weight:700;color:#fff;margin-right:6px}
.hbtn{background:#222;border:1px solid #333;color:#ddd;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap;transition:background .1s}
.hbtn:hover{background:#2c2c2c}
.hbtn.play{background:#1a3a1a;border-color:#2d6a2d;color:#6fef6f}
.hbtn.rec{background:#3a1a1a;border-color:#7a2a2a;color:#ef6f6f}
.hbtn.rec.active{animation:recpulse 1s infinite}
@keyframes recpulse{0%,100%{background:#5a1a1a}50%{background:#2a1a1a}}
.spacer{flex:1}
#fpsLabel{font-size:11px;color:#555;min-width:42px}

/* LAYOUT */
#layout{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
#sidebar{width:260px;background:#111;border-right:1px solid #222;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar-scroll{flex:1;overflow-y:auto;padding:10px}
.sidebar-scroll::-webkit-scrollbar{width:4px}.sidebar-scroll::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}

/* SECTION */
.sec{margin-bottom:12px}
.sec-head{font-size:11px;font-weight:700;color:#555;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;padding-left:2px}
.row{display:flex;gap:6px;align-items:center;margin-bottom:5px}
label.lbl{font-size:11px;color:#777;white-space:nowrap;min-width:56px}
input[type=range]{flex:1;accent-color:#3b82f6;height:3px}
input[type=color]{width:32px;height:24px;border:1px solid #333;border-radius:4px;background:none;cursor:pointer;padding:0}
input[type=text],select,textarea{width:100%;background:#0a0a0a;border:1px solid #252525;color:#e0e0e0;border-radius:5px;padding:6px 8px;font-size:12px;margin-bottom:4px}
textarea{height:50px;resize:none}
.val{font-size:11px;color:#3b82f6;min-width:26px;text-align:right}
.sbtn{background:#1a1a1a;border:1px solid #2a2a2a;color:#ccc;padding:5px 0;border-radius:5px;cursor:pointer;font-size:11px;flex:1;text-align:center;transition:all .1s}
.sbtn:hover{border-color:#3b82f6;color:#fff}
.sbtn.on{background:#1a2a3a;border-color:#3b82f6;color:#93c5fd}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:4px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:4px}

/* LOGO ANIM CARDS */
.anim-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:4px}
.anim-card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:6px;cursor:pointer;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:all .15s}
.anim-card:hover{border-color:#4a4a4a}
.anim-card.sel{border-color:#3b82f6;background:#0d1a2e}
.anim-card canvas{width:54px;height:54px;border-radius:3px;background:#0a0a0a}
.anim-card span{font-size:9px;color:#666}
.anim-card.sel span{color:#93c5fd}

/* MAIN CANVAS AREA */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#0a0a0a}
#canvasWrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#mainCanvas{background:#111;border:1px solid #222;display:block;max-width:100%;max-height:100%}
#timecodeBox{position:absolute;bottom:8px;right:10px;font-size:11px;color:#444;font-family:monospace;background:rgba(0,0,0,.5);padding:2px 7px;border-radius:4px;pointer-events:none}

/* SCENES STRIP */
#scenesStrip{height:80px;background:#0e0e0e;border-top:1px solid #1e1e1e;display:flex;align-items:center;gap:7px;padding:0 10px;overflow-x:auto;flex-shrink:0}
#scenesStrip::-webkit-scrollbar{height:3px}.#scenesStrip::-webkit-scrollbar-thumb{background:#2a2a2a}
.scene-card{position:relative;min-width:110px;height:62px;border-radius:6px;border:2px solid #2a2a2a;cursor:pointer;overflow:hidden;flex-shrink:0;transition:border-color .15s}
.scene-card canvas{width:100%;height:100%;display:block}
.scene-card:hover{border-color:#444}
.scene-card.active{border-color:#3b82f6}
.scene-label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);font-size:9px;text-align:center;padding:2px;color:#aaa}
.scene-del{position:absolute;top:2px;right:3px;color:#f55;font-size:10px;cursor:pointer;display:none}
.scene-card:hover .scene-del{display:block}
.add-scene-btn{min-width:60px;height:62px;border-radius:6px;border:1px dashed #2a2a2a;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#3a3a3a;font-size:22px;flex-shrink:0;transition:all .15s}
.add-scene-btn:hover{border-color:#3b82f6;color:#3b82f6}

/* AUDIO METER */
#meter{display:flex;gap:1px;align-items:flex-end;height:28px;padding:4px 0}
.mbar{width:7px;background:#22c55e;border-radius:1px;transition:height .05s}

/* UPLOAD ZONE */
.drop-zone{border:1px dashed #2a2a2a;border-radius:6px;padding:10px;text-align:center;font-size:11px;color:#444;cursor:pointer;margin-bottom:6px;transition:border-color .15s}
.drop-zone:hover{border-color:#3b82f6;color:#777}
.drop-zone input{display:none}
</style>
</head>
<body>

<header>
  <h1>⬡ NovaMotion</h1>
  <button class="hbtn play" id="playBtn" onclick="togglePlay()">▶ Lire</button>
  <button class="hbtn rec" id="recBtn" onclick="toggleRec()">⏺ REC</button>
  <button class="hbtn" onclick="exportPNG()">📷 PNG</button>
  <button class="hbtn" onclick="exportWEBM()">🎬 Exporter</button>
  <div class="spacer"></div>
  <span id="fpsLabel">60 fps</span>
</header>

<div id="layout">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-scroll">

      <!-- LOGO / ANIMATION -->
      <div class="sec">
        <div class="sec-head">Animation logo</div>
        <div class="anim-grid" id="animGrid"></div>
      </div>

      <!-- TEXTE -->
      <div class="sec">
        <div class="sec-head">Texte</div>
        <textarea id="txtContent" placeholder="Votre texte…">Mon Logo</textarea>
        <div class="row">
          <label class="lbl">Police</label>
          <select id="txtFont" style="flex:1">
            <option>Arial Black</option><option>Impact</option><option>Georgia</option>
            <option>Courier New</option><option>Trebuchet MS</option><option>Verdana</option>
          </select>
        </div>
        <div class="row">
          <label class="lbl">Taille</label>
          <input type="range" id="txtSize" min="14" max="160" value="72" step="1" oninput="tsv.textContent=this.value;syncAll()">
          <span class="val" id="tsv">72</span>
        </div>
        <div class="row">
          <label class="lbl">Couleur</label>
          <input type="color" id="txtColor" value="#ffffff" oninput="syncAll()">
          <label class="lbl" style="margin-left:8px">Fond</label>
          <input type="color" id="bgColor" value="#0a0a0a" oninput="syncAll()">
        </div>
        <div class="row">
          <label class="lbl">X</label>
          <input type="range" id="txtX" min="0" max="100" value="50" step="1" oninput="syncAll()">
          <label class="lbl">Y</label>
          <input type="range" id="txtY" min="0" max="100" value="50" step="1" oninput="syncAll()">
        </div>
        <div class="row">
          <label class="lbl">Animation</label>
          <select id="txtAnim" style="flex:1" onchange="syncAll()">
            <option value="none">Aucune</option>
            <option value="typewriter">Machine à écrire</option>
            <option value="wave">Vague</option>
            <option value="glitch">Glitch</option>
            <option value="rainbow">Arc-en-ciel</option>
            <option value="neon">Néon</option>
          </select>
        </div>
      </div>

      <!-- FOND -->
      <div class="sec">
        <div class="sec-head">Fond</div>
        <div class="row">
          <label class="lbl">Type</label>
          <select id="bgType" style="flex:1" onchange="syncAll()">
            <option value="solid">Uni</option>
            <option value="gradient">Dégradé</option>
            <option value="grid">Grille</option>
            <option value="dots">Points</option>
            <option value="particles">Particules</option>
            <option value="waves">Vagues</option>
          </select>
        </div>
        <div class="row">
          <label class="lbl">Couleur 2</label>
          <input type="color" id="bg2Color" value="#1a1a2e" oninput="syncAll()">
        </div>
      </div>

      <!-- EFFETS -->
      <div class="sec">
        <div class="sec-head">Effets</div>
        <div class="grid3">
          <button class="sbtn" id="btnSnow" onclick="toggleFX('snow',this)">❄ Neige</button>
          <button class="sbtn" id="btnFW" onclick="toggleFX('fireworks',this)">★ Feux</button>
          <button class="sbtn" id="btnRain" onclick="toggleFX('rain',this)">~ Pluie</button>
          <button class="sbtn" id="btnSpark" onclick="toggleFX('sparks',this)">✦ Étincelles</button>
          <button class="sbtn" id="btnLens" onclick="toggleFX('lens',this)">◎ Lens flare</button>
          <button class="sbtn" id="btnClear" onclick="clearFX()">✕ Effacer</button>
        </div>
        <div class="row">
          <label class="lbl">Vignette</label>
          <input type="range" id="vigAmt" min="0" max="1" value="0" step=".01" oninput="syncAll()">
        </div>
      </div>

      <!-- AUDIO -->
      <div class="sec">
        <div class="sec-head">Musique</div>
        <div class="drop-zone" onclick="document.getElementById('audioFile').click()">
          Cliquer pour importer un audio
          <input type="file" id="audioFile" accept="audio/*" onchange="loadAudio(this)">
        </div>
        <div id="audioPlayer"></div>
        <div class="row">
          <label class="lbl">Volume</label>
          <input type="range" id="volRange" min="0" max="1" value="0.8" step=".01" oninput="setVol(this.value)">
        </div>
        <div id="meter"></div>
      </div>

      <!-- LOGO IMAGE -->
      <div class="sec">
        <div class="sec-head">Logo / Image</div>
        <div class="drop-zone" onclick="document.getElementById('imgFile').click()">
          Importer image ou logo
          <input type="file" id="imgFile" accept="image/*" onchange="loadImg(this)">
        </div>
        <div id="imgControls" style="display:none">
          <div class="row"><label class="lbl">X</label><input type="range" id="imgX" min="0" max="100" value="50" step="1" oninput="syncAll()"><label class="lbl">Y</label><input type="range" id="imgY" min="0" max="100" value="50" step="1" oninput="syncAll()"></div>
          <div class="row"><label class="lbl">Taille</label><input type="range" id="imgScale" min="5" max="200" value="40" step="1" oninput="syncAll()"></div>
          <div class="row"><label class="lbl">Rotation</label><input type="range" id="imgRot" min="-180" max="180" value="0" step="1" oninput="syncAll()"></div>
          <div class="row"><label class="lbl">Anim logo</label>
            <select id="imgAnim" style="flex:1" onchange="syncAll()">
              <option value="none">Aucune</option>
              <option value="spin">Rotation</option>
              <option value="float">Lévitation</option>
              <option value="pulse">Pulse</option>
              <option value="bounce">Rebond</option>
              <option value="shake">Secousse</option>
            </select>
          </div>
        </div>
      </div>

      <!-- RESOLUTION -->
      <div class="sec">
        <div class="sec-head">Format</div>
        <select style="width:100%" onchange="setRes(this.value)">
          <option value="1280,720">1280 × 720 (16:9)</option>
          <option value="1920,1080">1920 × 1080 (Full HD)</option>
          <option value="720,720">720 × 720 (Carré)</option>
          <option value="1080,1920">1080 × 1920 (Portrait)</option>
          <option value="854,480">854 × 480 (SD)</option>
        </select>
      </div>

    </div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="canvasWrap">
      <canvas id="mainCanvas" width="1280" height="720"></canvas>
      <div id="timecodeBox">00:00:00</div>
    </div>
    <div id="scenesStrip">
      <!-- Scènes injectées par JS -->
      <div class="add-scene-btn" onclick="addScene()" title="Nouvelle scène">+</div>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// ÉTAT GLOBAL
// ─────────────────────────────────────────────
const C = document.getElementById('mainCanvas');
const ctx = C.getContext('2d');

let S = {
  playing: false, recording: false,
  t: 0, frame: 0, lastTS: 0,
  fpsAccum: 0, fpsCount: 0,
  bgType: 'solid', bgColor: '#0a0a0a', bg2: '#1a1a2e',
  txtContent: 'Mon Logo', txtFont: 'Arial Black', txtSize: 72,
  txtColor: '#ffffff', txtX: 50, txtY: 50, txtAnim: 'none',
  logoAnim: 'flat_pulse', // selected animation preset
  imgObj: null, imgX:50, imgY:50, imgScale:40, imgRot:0, imgAnim:'float',
  vigAmt: 0,
  fx: { snow:false, fireworks:false, rain:false, sparks:false, lens:false },
  particles: [], snow:[], rain:[], sparks:[], fireworks:[],
  lensX: 0, lensPhase: 0,
  scenes: [], currentScene: 0,
  audioEl: null, analyser: null, audioCtx: null,
  mediaRec: null, recChunks: [],
  matrixCols: null,
};

// ─────────────────────────────────────────────
// LOGO ANIMATION PRESETS  (flat, 2d, 3d)
// ─────────────────────────────────────────────
const LOGO_ANIMS = [
  { id:'flat_pulse',  label:'Flat Pulse',  cat:'flat', draw: flatPulse },
  { id:'flat_hex',    label:'Flat Hex',    cat:'flat', draw: flatHex },
  { id:'flat_ring',   label:'Flat Ring',   cat:'flat', draw: flatRing },
  { id:'flat_bars',   label:'Flat Bars',   cat:'flat', draw: flatBars },
  { id:'flat_tri',    label:'Flat Tri',    cat:'flat', draw: flatTri },
  { id:'flat_wave',   label:'Flat Wave',   cat:'flat', draw: flatWave },
  { id:'d2_orbit',    label:'2D Orbite',   cat:'2d',   draw: d2Orbit },
  { id:'d2_morph',    label:'2D Morphe',   cat:'2d',   draw: d2Morph },
  { id:'d2_logo',     label:'2D Reveal',   cat:'2d',   draw: d2Reveal },
  { id:'d3_cube',     label:'3D Cube',     cat:'3d',   draw: d3Cube },
  { id:'d3_sphere',   label:'3D Sphère',   cat:'3d',   draw: d3Sphere },
  { id:'d3_dna',      label:'3D DNA',      cat:'3d',   draw: d3DNA },
];

// ── FLAT ANIMATIONS ──────────────────────────

function flatPulse(c2, t, W, H) {
  const cx=W/2, cy=H/2, p=Math.sin(t*2)*.5+.5;
  c2.clearRect(0,0,W,H);
  for(let i=4;i>=0;i--){
    const r=(30+i*18)*(1+p*.15);
    c2.beginPath(); c2.arc(cx,cy,r,0,Math.PI*2);
    c2.fillStyle=`hsla(${210+i*15},80%,${40+p*25}%,${.12+i*.06})`;
    c2.fill();
  }
  c2.beginPath(); c2.arc(cx,cy,22*(1+p*.1),0,Math.PI*2);
  c2.fillStyle=`hsl(${210+p*30},90%,${60+p*20}%)`;
  c2.fill();
}

function flatHex(c2, t, W, H) {
  const cx=W/2, cy=H/2;
  c2.clearRect(0,0,W,H);
  const r=30, sides=6;
  for(let ring=0;ring<3;ring++){
    const rr=r*(ring+1);
    c2.beginPath();
    for(let i=0;i<sides;i++){
      const a=i/sides*Math.PI*2+t*.5+ring*.3;
      ring===0&&i===0?c2.moveTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a)):i===0?c2.moveTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a)):c2.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));
    }
    c2.closePath();
    c2.strokeStyle=`hsl(${200+ring*25},90%,${55+ring*10}%)`;
    c2.lineWidth=2; c2.stroke();
  }
  c2.beginPath(); c2.arc(cx,cy,12,0,Math.PI*2);
  c2.fillStyle='#60a5fa'; c2.fill();
}

function flatRing(c2, t, W, H) {
  const cx=W/2, cy=H/2;
  c2.clearRect(0,0,W,H);
  const segments=12;
  for(let i=0;i<segments;i++){
    const a=i/segments*Math.PI*2+t;
    const a2=(i+.7)/segments*Math.PI*2+t;
    const hue=(i/segments*360+t*30)%360;
    c2.beginPath();
    c2.arc(cx,cy,36,a,a2);
    c2.strokeStyle=`hsl(${hue},90%,65%)`;
    c2.lineWidth=7; c2.stroke();
  }
  c2.beginPath(); c2.arc(cx,cy,15,0,Math.PI*2);
  c2.fillStyle='#fff'; c2.fill();
}

function flatBars(c2, t, W, H) {
  c2.clearRect(0,0,W,H);
  const bars=9, bw=6, gap=4, total=bars*(bw+gap);
  const ox=W/2-total/2;
  for(let i=0;i<bars;i++){
    const h=(Math.sin(t*2+i*.6)*.5+.5)*H*.7+10;
    const hue=200+i*12;
    c2.fillStyle=`hsl(${hue},80%,60%)`;
    c2.fillRect(ox+i*(bw+gap), H/2-h/2, bw, h);
  }
}

function flatTri(c2, t, W, H) {
  const cx=W/2, cy=H/2;
  c2.clearRect(0,0,W,H);
  for(let k=0;k<3;k++){
    const angle=t*(.5+k*.3);
    const r=20+k*14;
    c2.save(); c2.translate(cx,cy); c2.rotate(angle);
    c2.beginPath();
    for(let i=0;i<3;i++){
      const a=i/3*Math.PI*2-Math.PI/2;
      i===0?c2.moveTo(r*Math.cos(a),r*Math.sin(a)):c2.lineTo(r*Math.cos(a),r*Math.sin(a));
    }
    c2.closePath();
    c2.strokeStyle=`hsl(${180+k*40},85%,60%)`; c2.lineWidth=2+k*.5; c2.stroke();
    c2.restore();
  }
}

function flatWave(c2, t, W, H) {
  c2.clearRect(0,0,W,H);
  const cy=H/2;
  for(let w=0;w<4;w++){
    c2.beginPath();
    for(let x=0;x<=W;x+=2){
      const y=cy+Math.sin(x/12+t*(1+w*.4)+w)*12*(1+w*.5);
      x===0?c2.moveTo(x,y):c2.lineTo(x,y);
    }
    c2.strokeStyle=`hsla(${210+w*20},85%,${55+w*8}%,${.8-w*.15})`;
    c2.lineWidth=2; c2.stroke();
  }
}

// ── 2D ANIMATIONS ────────────────────────────

function d2Orbit(c2, t, W, H) {
  const cx=W/2, cy=H/2;
  c2.clearRect(0,0,W,H);
  // center star
  c2.beginPath(); c2.arc(cx,cy,14,0,Math.PI*2);
  c2.fillStyle='#fbbf24'; c2.fill();
  // orbiting bodies
  [[30,1.2,8,'#60a5fa'],[48,.7,5,'#a78bfa'],[64,.4,6,'#34d399']].forEach(([r,spd,sz,col])=>{
    const a=t*spd;
    const bx=cx+r*Math.cos(a), by=cy+r*.35*Math.sin(a);
    c2.beginPath(); c2.ellipse(cx,cy,r,r*.35,0,0,Math.PI*2);
    c2.strokeStyle=col+'55'; c2.lineWidth=1; c2.stroke();
    c2.beginPath(); c2.arc(bx,by,sz,0,Math.PI*2);
    c2.fillStyle=col; c2.fill();
  });
}

function d2Morph(c2, t, W, H) {
  const cx=W/2, cy=H/2, p=(Math.sin(t)*.5+.5);
  c2.clearRect(0,0,W,H);
  const pts=6, r=34;
  c2.beginPath();
  for(let i=0;i<pts;i++){
    const a=i/pts*Math.PI*2-Math.PI/2;
    const circ_x=cx+r*Math.cos(a), circ_y=cy+r*Math.sin(a);
    const sq_x=cx+(i%2===0?r:-r)*.85, sq_y=cy+(i<pts/2?-r:r)*.7;
    const x=circ_x+(sq_x-circ_x)*p, y=circ_y+(sq_y-circ_y)*p;
    i===0?c2.moveTo(x,y):c2.lineTo(x,y);
  }
  c2.closePath();
  const hue=210+p*60;
  c2.fillStyle=`hsl(${hue},80%,55%)`;
  c2.fill();
  c2.strokeStyle=`hsl(${hue+30},90%,70%)`; c2.lineWidth=2; c2.stroke();
}

function d2Reveal(c2, t, W, H) {
  c2.clearRect(0,0,W,H);
  const p=((t*.4)%1);
  const cx=W/2, cy=H/2, r=38;
  c2.save();
  c2.beginPath(); c2.arc(cx,cy,r,0,Math.PI*2); c2.clip();
  c2.fillStyle='#1e3a5f'; c2.fillRect(0,0,W,H);
  // sweep reveal
  c2.beginPath(); c2.moveTo(cx,cy);
  c2.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+p*Math.PI*2); c2.closePath();
  c2.fillStyle='#3b82f6'; c2.fill();
  c2.restore();
  // border
  c2.beginPath(); c2.arc(cx,cy,r,0,Math.PI*2);
  c2.strokeStyle='#60a5fa'; c2.lineWidth=3; c2.stroke();
  // center dot
  c2.beginPath(); c2.arc(cx,cy,8,0,Math.PI*2);
  c2.fillStyle='#fff'; c2.fill();
}

// ── 3D ANIMATIONS ────────────────────────────

function d3Cube(c2, t, W, H) {
  c2.clearRect(0,0,W,H);
  const cx=W/2, cy=H/2, s=28;
  const rx=t*.5, ry=t*.8;
  // 3D cube vertices
  const verts=[];
  for(let i=0;i<8;i++){
    let x=((i&1)?1:-1)*s, y=((i&2)?1:-1)*s, z=((i&4)?1:-1)*s;
    const y2=y*Math.cos(rx)-z*Math.sin(rx), z2=y*Math.sin(rx)+z*Math.cos(rx);
    const x3=x*Math.cos(ry)+z2*Math.sin(ry), z3=-x*Math.sin(ry)+z2*Math.cos(ry);
    const scale=200/(200+z3);
    verts.push([cx+x3*scale, cy+y2*scale, z3]);
  }
  const faces=[[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]];
  const faceColors=['#1d4ed8','#2563eb','#3b82f6','#60a5fa','#1e3a8a','#1e40af'];
  faces.forEach((f,i)=>{
    c2.beginPath();
    f.forEach((vi,j)=>j===0?c2.moveTo(verts[vi][0],verts[vi][1]):c2.lineTo(verts[vi][0],verts[vi][1]));
    c2.closePath();
    c2.fillStyle=faceColors[i]+'cc'; c2.fill();
    c2.strokeStyle='#93c5fd'; c2.lineWidth=1; c2.stroke();
  });
}

function d3Sphere(c2, t, W, H) {
  c2.clearRect(0,0,W,H);
  const cx=W/2, cy=H/2, r=36;
  // latitude rings
  const rings=8;
  for(let i=1;i<rings;i++){
    const phi=i/rings*Math.PI;
    const ry_r=Math.sin(phi)*r;
    const zy=Math.cos(phi)*r;
    const a=t+i*.3;
    c2.beginPath(); c2.ellipse(cx,cy+zy*.5,ry_r,ry_r*.35,0,0,Math.PI*2);
    c2.strokeStyle=`hsla(${210+i*8},80%,60%,${.25+Math.sin(t+i)*.1})`;
    c2.lineWidth=1; c2.stroke();
    // dot on ring
    c2.beginPath(); c2.arc(cx+ry_r*Math.cos(a),cy+zy*.5+ry_r*.35*Math.sin(a)*.3,2.5,0,Math.PI*2);
    c2.fillStyle=`hsl(${210+i*8},90%,70%)`; c2.fill();
  }
  // vertical arcs
  for(let j=0;j<4;j++){
    const a=j/4*Math.PI+t*.3;
    c2.beginPath();
    c2.ellipse(cx,cy,r*Math.abs(Math.cos(a)),r*.5,a,0,Math.PI*2);
    c2.strokeStyle='#3b82f655'; c2.lineWidth=1; c2.stroke();
  }
  // glow center
  c2.beginPath(); c2.arc(cx,cy,10,0,Math.PI*2);
  c2.fillStyle='rgba(96,165,250,.8)'; c2.fill();
}

function d3DNA(c2, t, W, H) {
  c2.clearRect(0,0,W,H);
  const cx=W/2, cy=H/2, r=24, height=64, rungs=10;
  for(let i=0;i<rungs;i++){
    const p=i/rungs;
    const y=cy-height/2+p*height;
    const a1=p*Math.PI*3+t, a2=a1+Math.PI;
    const x1=cx+r*Math.cos(a1), x2=cx+r*Math.cos(a2);
    // rung
    c2.beginPath(); c2.moveTo(x1,y); c2.lineTo(x2,y);
    c2.strokeStyle=`rgba(99,102,241,.5)`; c2.lineWidth=2; c2.stroke();
    // strand dots
    c2.beginPath(); c2.arc(x1,y,3.5,0,Math.PI*2); c2.fillStyle='#818cf8'; c2.fill();
    c2.beginPath(); c2.arc(x2,y,3.5,0,Math.PI*2); c2.fillStyle='#f472b6'; c2.fill();
  }
  // strands
  for(let strand=0;strand<2;strand++){
    c2.beginPath();
    for(let i=0;i<=40;i++){
      const p=i/40, y=cy-height/2+p*height;
      const a=(strand===0?1:-1)*Math.PI;
      const x=cx+r*Math.cos(p*Math.PI*3+t+strand*Math.PI);
      i===0?c2.moveTo(x,y):c2.lineTo(x,y);
    }
    c2.strokeStyle=strand===0?'#818cf8':'#f472b6';
    c2.lineWidth=2; c2.stroke();
  }
}

// ─────────────────────────────────────────────
// MAIN DRAW
// ─────────────────────────────────────────────
function drawFrame(ts) {
  const dt=Math.min((ts-S.lastTS)/1000,.1);
  S.lastTS=ts;
  S.fpsAccum+=dt; S.fpsCount++;
  if(S.fpsAccum>=1){ document.getElementById('fpsLabel').textContent=S.fpsCount+' fps'; S.fpsAccum=0;S.fpsCount=0; }
  if(S.playing) { S.t+=dt; S.frame++; }

  const W=C.width, H=C.height, t=S.t;

  // ── BACKGROUND ──
  drawBG(W,H,t);

  // ── LOGO ANIMATION ──
  const la=LOGO_ANIMS.find(a=>a.id===S.logoAnim);
  if(la){
    ctx.save();
    ctx.translate(W/2,H/2);
    const scale=Math.min(W,H)/140;
    ctx.scale(scale,scale);
    ctx.translate(-W/2,-H/2);
    la.draw(ctx,t,W,H);
    ctx.restore();
  }

  // ── USER IMAGE ──
  drawUserImage(W,H,t);

  // ── TEXT ──
  drawText(W,H,t);

  // ── PARTICLES / OVERLAYS ──
  drawOverlays(W,H,t);

  // ── VIGNETTE ──
  const v=parseFloat(document.getElementById('vigAmt').value);
  if(v>0){
    const g=ctx.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,H*.8);
    g.addColorStop(0,'transparent');
    g.addColorStop(1,`rgba(0,0,0,${v})`);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }

  // ── TIMECODE ──
  const mm=Math.floor(t/60).toString().padStart(2,'0');
  const ss=Math.floor(t%60).toString().padStart(2,'0');
  const ff=Math.floor((t%1)*60).toString().padStart(2,'0');
  document.getElementById('timecodeBox').textContent=`${mm}:${ss}:${ff}`;

  // ── SCENE THUMBNAILS ──
  if(S.frame%30===0) updateSceneThumbs();

  requestAnimationFrame(drawFrame);
}

function drawBG(W,H,t){
  const c1=document.getElementById('bgColor').value;
  const c2=document.getElementById('bg2Color').value;
  switch(S.bgType){
    case 'solid':
      ctx.fillStyle=c1; ctx.fillRect(0,0,W,H); break;
    case 'gradient':{
      const g=ctx.createLinearGradient(0,0,W,H);
      g.addColorStop(0,c1); g.addColorStop(1,c2);
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H); break;}
    case 'grid':
      ctx.fillStyle=c1; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle=c2+'44'; ctx.lineWidth=1;
      for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
      for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
      break;
    case 'dots':
      ctx.fillStyle=c1; ctx.fillRect(0,0,W,H);
      ctx.fillStyle=c2+'66';
      for(let x=20;x<W;x+=40)for(let y=20;y<H;y+=40){ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill()}
      break;
    case 'particles':
      ctx.fillStyle=c1; ctx.fillRect(0,0,W,H);
      if(!S._pts){ S._pts=[]; for(let i=0;i<80;i++) S._pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,h:Math.random()*360}); }
      ctx.fillStyle=c1; ctx.fillRect(0,0,W,H);
      S._pts.forEach(p=>{p.x=(p.x+p.vx+W)%W; p.y=(p.y+p.vy+H)%H; ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fillStyle=`hsla(${p.h},80%,60%,.5)`;ctx.fill()});
      break;
    case 'waves':
      ctx.fillStyle=c1; ctx.fillRect(0,0,W,H);
      for(let i=0;i<5;i++){ctx.beginPath();for(let x=0;x<=W;x+=4){const y=H/2+Math.sin(x/100+t+i*.7)*(40+i*20);x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.strokeStyle=`hsla(${200+i*15},80%,55%,.18)`;ctx.lineWidth=2;ctx.stroke();}
      break;
  }
}

function drawUserImage(W,H,t){
  if(!S.imgObj) return;
  const ix=parseFloat(document.getElementById('imgX').value)/100*W;
  const iy=parseFloat(document.getElementById('imgY').value)/100*H;
  const sc=parseFloat(document.getElementById('imgScale').value)/100;
  let rot=parseFloat(document.getElementById('imgRot').value)*Math.PI/180;
  let dx=0, dy=0, sc2=sc;
  switch(document.getElementById('imgAnim').value){
    case 'spin': rot+=t*1.5; break;
    case 'float': dy=Math.sin(t*1.5)*12; break;
    case 'pulse': sc2=sc*(1+Math.sin(t*2)*.08); break;
    case 'bounce': dy=Math.abs(Math.sin(t*2))*-20; break;
    case 'shake': dx=(Math.random()-.5)*6; break;
  }
  const iw=S.imgObj.width*sc2, ih=S.imgObj.height*sc2;
  ctx.save();
  ctx.translate(ix+dx,iy+dy);
  ctx.rotate(rot);
  ctx.drawImage(S.imgObj,-iw/2,-ih/2,iw,ih);
  ctx.restore();
}

function drawText(W,H,t){
  const txt=document.getElementById('txtContent').value;
  const font=document.getElementById('txtFont').value;
  const size=parseFloat(document.getElementById('txtSize').value);
  const col=document.getElementById('txtColor').value;
  const tx=parseFloat(document.getElementById('txtX').value)/100*W;
  const ty=parseFloat(document.getElementById('txtY').value)/100*H;
  const anim=document.getElementById('txtAnim').value;
  ctx.save();
  ctx.font=`bold ${size}px "${font}"`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=8;

  switch(anim){
    case 'none':
      ctx.fillStyle=col; ctx.fillText(txt,tx,ty); break;
    case 'typewriter':{
      const n=Math.floor(((t*.8)%1)*txt.length);
      ctx.fillStyle=col; ctx.fillText(txt.slice(0,n),tx,ty); break;}
    case 'wave':{
      ctx.textAlign='left';
      const tw=ctx.measureText(txt).width;
      [...txt].forEach((ch,i)=>{
        const cx2=tx-tw/2+ctx.measureText(txt.slice(0,i)).width;
        const cy2=ty+Math.sin(t*2+i*.5)*14;
        ctx.fillStyle=col; ctx.fillText(ch,cx2,cy2);
      }); break;}
    case 'glitch':
      ['rgba(255,0,0,.6)','rgba(0,255,255,.6)',col].forEach((c,i)=>{
        ctx.fillStyle=c;
        ctx.fillText(txt,tx+(i===0?Math.sin(t*5)*5:i===1?Math.cos(t*4)*-5:0),ty+(i===0?2:0));
      }); break;
    case 'rainbow':{
      ctx.textAlign='left';
      const tw2=ctx.measureText(txt).width;
      [...txt].forEach((ch,i)=>{
        const cx2=tx-tw2/2+ctx.measureText(txt.slice(0,i)).width;
        ctx.fillStyle=`hsl(${(i/txt.length*360+t*60)%360},100%,65%)`;
        ctx.fillText(ch,cx2,ty);
      }); break;}
    case 'neon':
      for(let r=12;r>=0;r--){
        ctx.shadowColor=col; ctx.shadowBlur=r*4;
        ctx.fillStyle=r===0?col:`rgba(255,255,255,${.03*(12-r)})`;
        ctx.fillText(txt,tx,ty);
      } break;
  }
  ctx.restore();
}

// ─────────────────────────────────────────────
// OVERLAYS
// ─────────────────────────────────────────────
function drawOverlays(W,H,t){
  if(S.fx.snow){ spawnSnow(W); drawSnow(W,H); }
  if(S.fx.rain){ spawnRain(W); drawRain(W,H); }
  if(S.fx.sparks){ spawnSparks(W,H); drawSparks(); }
  if(S.fx.fireworks){ if(S.frame%40===0) spawnFirework(W,H); drawFireworks(); }
  if(S.fx.lens) drawLens(W,H,t);
}

function spawnSnow(W){ while(S.snow.length<150) S.snow.push({x:Math.random()*W,y:-5,s:Math.random()*3+1,sp:Math.random()+.3}); }
function drawSnow(W,H){ S.snow.forEach((p,i)=>{p.y+=p.sp; p.x+=Math.sin(S.t+i)*.3; if(p.y>H+10)p.y=-5; ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.75)';ctx.fill();}); }
function spawnRain(W){ while(S.rain.length<300) S.rain.push({x:Math.random()*W,y:Math.random()*600,sp:Math.random()*6+6,l:Math.random()*12+8}); }
function drawRain(W,H){ ctx.strokeStyle='rgba(150,190,255,.35)';ctx.lineWidth=1; S.rain.forEach(p=>{p.y+=p.sp;if(p.y>H+20)p.y=-20;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+p.l*.2,p.y+p.l);ctx.stroke();}); }
function spawnSparks(W,H){ if(S.frame%3===0) for(let i=0;i<3;i++) S.sparks.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4-1,life:1,h:Math.random()*60+30}); }
function drawSparks(){ S.sparks.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.life-=.025;if(p.life<=0){S.sparks.splice(i,1);return;}ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fillStyle=`hsla(${p.h},100%,70%,${p.life})`;ctx.fill();}); }
function spawnFirework(W,H){ const fw={x:Math.random()*W*.8+W*.1,y:Math.random()*H*.5,ps:[],h:Math.random()*360}; for(let i=0;i<50;i++){const a=Math.random()*Math.PI*2,sp=Math.random()*4+2;fw.ps.push({x:fw.x,y:fw.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1});} S.fireworks.push(fw); }
function drawFireworks(){ S.fireworks.forEach((fw,fi)=>{fw.ps.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.life-=.018;if(p.life<=0){fw.ps.splice(i,1);return;}ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fillStyle=`hsla(${fw.h},100%,70%,${p.life})`;ctx.fill();});if(fw.ps.length===0)S.fireworks.splice(fi,1);}); }
function drawLens(W,H,t){ S.lensX=(S.lensX+1.5)%W; const cx=S.lensX, cy=H*(.3+Math.sin(t*.4)*.1); const g=ctx.createRadialGradient(cx,cy,0,cx,cy,80); g.addColorStop(0,'rgba(255,255,255,.18)');g.addColorStop(.4,'rgba(255,220,150,.07)');g.addColorStop(1,'transparent'); ctx.fillStyle=g;ctx.fillRect(0,0,W,H); [30,50,70].forEach((r,i)=>{ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle=`rgba(255,255,255,${.08-i*.02})`;ctx.lineWidth=1;ctx.stroke();}); }

// AUDIO
// ─────────────────────────────────────────────
function loadAudio(input){
  const file=input.files[0]; if(!file) return;
  const url=URL.createObjectURL(file);
  const el=document.createElement('audio');
  el.controls=true; el.src=url;
  el.style.cssText='width:100%;margin-top:6px;filter:invert(1) brightness(.8)';
  const box=document.getElementById('audioPlayer');
  box.innerHTML=''; box.appendChild(el);
  S.audioEl=el;
  el.volume=parseFloat(document.getElementById('volRange').value);

  // Web Audio analyser
  try{
    if(!S.audioCtx) S.audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const src=S.audioCtx.createMediaElementSource(el);
    S.analyser=S.audioCtx.createAnalyser();
    S.analyser.fftSize=32;
    src.connect(S.analyser);
    S.analyser.connect(S.audioCtx.destination);
    startMeter();
  }catch(e){}
}

function setVol(v){ if(S.audioEl) S.audioEl.volume=v; }

function startMeter(){
  const m=document.getElementById('meter'); m.innerHTML='';
  const bars=[];
  for(let i=0;i<12;i++){const b=document.createElement('div');b.className='mbar';b.style.height='2px';m.appendChild(b);bars.push(b);}
  function tick(){
    if(!S.analyser){requestAnimationFrame(tick);return;}
    const d=new Uint8Array(S.analyser.frequencyBinCount);
    S.analyser.getByteFrequencyData(d);
    bars.forEach((b,i)=>{const v=d[Math.floor(i*d.length/bars.length)]/255;b.style.height=(v*26+2)+'px';b.style.background=v>.8?'#ef4444':v>.5?'#f59e0b':'#22c55e';});
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function exportPNG(){

function exportWEBM(){
  S.recChunks=[];
  const stream=C.captureStream(60);
  let finalStream=stream;
  if(S.audioEl&&S.audioCtx&&S.analyser){
    try{
      const dest=S.audioCtx.createMediaStreamDestination();
      S.analyser.connect(dest);
      finalStream=new MediaStream([...stream.getVideoTracks(),...dest.stream.getAudioTracks()]);
    }catch(e){}
  }
  const types=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'video/webm';
  S.mediaRec=new MediaRecorder(finalStream,{mimeType:mime});
  S.mediaRec.ondataavailable=e=>{if(e.data.size>0)S.recChunks.push(e.data);};
  S.mediaRec.onstop=()=>{
    const blob=new Blob(S.recChunks,{type:mime});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='novamotion.webm';a.click();
    document.getElementById('recBtn').classList.remove('active');
    document.getElementById('recBtn').textContent='⏺ REC';
    S.recording=false;
  };
  S.mediaRec.start(100);
  S.recording=true;
  document.getElementById('recBtn').classList.add('active');
  document.getElementById('recBtn').textContent='■ Stop';
  if(!S.playing) togglePlay();
}

function toggleRec(){
  if(!S.recording){ exportWEBM(); }
  else { S.mediaRec?.stop(); }
}

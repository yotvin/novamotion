<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NovaMotion Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#eaf2fd;--pn:#fff;--pn2:#f1f6ff;--bd:#d3e2f6;--tx:#14264a;--tx2:#60769c;--ac:#2f6df6;--ac2:#dce8ff;--sh:0 10px 30px rgba(47,109,246,.12);--cv:#dbe7fa;--ok:#18a058}
:root[data-theme=dark]{--bg:#0b0b0b;--pn:#131313;--pn2:#1a1a1a;--bd:#262626;--tx:#ececec;--tx2:#8a8a8a;--ac:#5b9bff;--ac2:#1a2a45;--sh:0 10px 30px rgba(0,0,0,.5);--cv:#0f0f0f}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0b0b;--pn:#131313;--pn2:#1a1a1a;--bd:#262626;--tx:#ececec;--tx2:#8a8a8a;--ac:#5b9bff;--ac2:#1a2a45;--sh:0 10px 30px rgba(0,0,0,.5);--cv:#0f0f0f}}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:13px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .3s,color .3s}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:700;font-size:16px;letter-spacing:-.2px;margin-right:6px}.logo i{font-style:normal;color:var(--ac)}
.btn{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:7px 13px;transition:all .15s}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12px}
.sp{flex:1}
#time{font-variant-numeric:tabular-nums;color:var(--tx2);min-width:92px;text-align:center}
select{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:7px 9px}
main{flex:1;display:grid;grid-template-columns:310px 1fr;gap:12px;padding:0 16px 12px;min-height:0}
aside{background:var(--pn);border-radius:16px;box-shadow:var(--sh);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex;padding:6px;gap:2px;border-bottom:1px solid var(--bd)}
.tab{flex:1;background:none;border:0;border-radius:9px;padding:7px 2px;color:var(--tx2);font-size:12px}
.tab.on{background:var(--ac2);color:var(--ac);font-weight:600}
.panel{display:none;padding:14px;overflow-y:auto;flex:1}.panel.on{display:block}
h3{font-size:12px;font-weight:600;color:var(--tx2);margin:14px 0 8px}h3:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opt{background:var(--pn2);border:1px solid transparent;border-radius:9px;padding:8px 4px;font-size:12px;text-align:center;transition:all .15s}
.opt:hover{border-color:var(--bd)}.opt.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.f{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.f>span:first-child{width:78px;color:var(--tx2);font-size:12px;flex-shrink:0}
.f input[type=range]{flex:1;accent-color:var(--ac)}
.f .v{width:30px;text-align:right;font-size:11px;color:var(--tx2)}
.f input[type=text],.f select,.f input[type=number]{flex:1;min-width:0;background:var(--pn2);border:1px solid var(--bd);border-radius:8px;padding:6px 8px}
.f input[type=color]{width:34px;height:26px;border:1px solid var(--bd);border-radius:7px;background:none;padding:1px}
label.chip{display:inline-flex;align-items:center;gap:6px;background:var(--pn2);border-radius:9px;padding:7px 10px;margin:0 6px 6px 0;cursor:pointer}
label.chip input{accent-color:var(--ac)}
.drop{display:block;border:1.5px dashed var(--bd);border-radius:12px;padding:14px;text-align:center;color:var(--tx2);cursor:pointer;margin-bottom:10px}
.drop:hover{border-color:var(--ac);color:var(--ac)}.drop input{display:none}
section.stage{display:flex;flex-direction:column;min-height:0;gap:10px}
#wrap{flex:1;min-height:0;background:var(--cv);border-radius:16px;display:flex;align-items:center;justify-content:center;padding:14px;box-shadow:var(--sh)}
canvas#cv{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.bar{display:flex;align-items:center;gap:10px;background:var(--pn);border-radius:14px;padding:8px 12px;box-shadow:var(--sh)}
#scrub{flex:1;accent-color:var(--ac)}
#strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.sc{flex:1 0 108px;background:var(--pn);border:1.5px solid var(--bd);border-radius:12px;padding:8px;cursor:pointer;min-height:58px;transition:all .15s;position:relative;overflow:hidden}
.sc.on{border-color:var(--ac);box-shadow:var(--sh)}
.sc b{display:block;font-size:12px}.sc small{color:var(--tx2);font-size:11px}
.sc::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--a),var(--b))}
#prog{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:12px 18px;box-shadow:var(--sh);min-width:260px;display:none;z-index:9}
#prog div{height:5px;background:var(--bd);border-radius:3px;margin-top:8px;overflow:hidden}#prog i{display:block;height:100%;width:0;background:var(--ac)}
@media(max-width:820px){body{overflow:auto}main{grid-template-columns:1fr}aside{max-height:340px}#wrap{min-height:240px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">Nova<i>Motion</i></div>
  <button class="btn" id="play">▶ Lire</button>
  <span id="time">0:00 / 0:00</span>
  <select id="res" aria-label="Format">
    <option value="1280,720">1280×720 · Paysage</option><option value="1920,1080">1920×1080 · Full HD</option>
    <option value="1080,1080">1080×1080 · Carré</option><option value="1080,1920">1080×1920 · Vertical</option>
  </select>
  <div class="sp"></div>
  <button class="btn" id="theme" title="Changer de thème">◐ Thème</button>
  <button class="btn" id="png">Image PNG</button>
  <button class="btn pri" id="exp">Exporter la vidéo</button>
</header>
<main>
<aside>
  <div class="tabs" id="tabs"></div>
  <div class="panel on" id="p-anim"></div>
  <div class="panel" id="p-text"></div>
  <div class="panel" id="p-bg"></div>
  <div class="panel" id="p-fx"></div>
  <div class="panel" id="p-media"></div>
</aside>
<section class="stage">
  <div id="wrap"><canvas id="cv" width="1280" height="720"></canvas></div>
  <div class="bar"><input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Position"></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn sm" id="add">+ Scène</button><button class="btn sm" id="dup">Dupliquer</button>
    <button class="btn sm" id="left">←</button><button class="btn sm" id="right">→</button>
    <button class="btn sm" id="del">Supprimer</button>
  </div>
  <div id="strip"></div>
</section>
</main>
<div id="prog"><span id="pmsg">Export en cours…</span><div><i id="pbar"></i></div></div>
<script>
const $=s=>document.querySelector(s),TAU=Math.PI*2,{sin,cos,abs,sqrt,floor,min,max,PI}=Math;
const h=i=>{const x=sin(i*127.1+311.7)*43758.5453;return x-floor(x)};
const cv=$('#cv'),X=cv.getContext('2d'),off=document.createElement('canvas'),O=off.getContext('2d');
off.width=1280;off.height=720;
const def=()=>({anim:'pulse',bg:'aurora',c1:'#0b1226',c2:'#2f6df6',c3:'#8b5cf6',accent:'#7db3ff',text:'NovaMotion',sub:'Créez vos animations',font:'Segoe UI',size:84,tcol:'#ffffff',tanim:'slide',tx:50,ty:74,lscale:1,lx:50,ly:36,speed:1,dur:5,trans:'fade',hue:0,snow:0,confetti:0,sparks:0,bubbles:0,scan:0,vig:.3,grain:0,img:0,ix:50,iy:50,isz:25});
let S=[def(),Object.assign(def(),{anim:'cube',bg:'mesh',text:'Scène deux',sub:'Ajoutez, réordonnez, exportez'}),Object.assign(def(),{anim:'galaxy',bg:'stars',text:'À vous de jouer',sub:'',tanim:'neon'})];
let ci=0,T=1.5,playing=false,exporting=false,IMG=null,AUD=null,ac=null,adest=null,mr=null,chunks=[];
const cur=()=>S[ci],tot=()=>S.reduce((a,s)=>a+s.dur,0);
const loc=t=>{let a=0;for(let i=0;i<S.length;i++){if(t<a+S[i].dur||i==S.length-1)return[i,t-a];a+=S[i].dur}};
const start=i=>S.slice(0,i).reduce((a,s)=>a+s.dur,0);
const ANIMS={pulse:'Pulsation',rings:'Anneaux',orbit:'Orbites',bars:'Égaliseur',hex:'Hexagones',spiral:'Spirale',cube:'Cube 3D',torus:'Tore 3D',dna:'ADN 3D',tess:'Tesseract',galaxy:'Galaxie'};
const BGS={solid:'Uni',gradient:'Dégradé',mesh:'Mesh',grid:'Grille',particles:'Réseau',aurora:'Aurore',stars:'Étoiles',waves:'Vagues',plasma:'Plasma'};
const FONTS=['Segoe UI','Georgia','Arial Black','Impact','Trebuchet MS','Courier New','Palatino','Verdana'];

/* ---------- UI ---------- */
const R=(k,l,a,b,st)=>`<div class="f"><span>${l}</span><input type="range" data-k="${k}" min="${a}" max="${b}" step="${st}"><span class="v"></span></div>`;
const C=(k,l)=>`<div class="f"><span>${l}</span><input type="color" data-k="${k}"></div>`;
const K=(k,l)=>`<label class="chip"><input type="checkbox" data-k="${k}">${l}</label>`;
const G=(id,o)=>`<div class="grid" id="${id}">${Object.entries(o).map(([k,v])=>`<button class="opt" data-v="${k}">${v}</button>`).join('')}</div>`;
const tabs={anim:'Animation',text:'Texte',bg:'Fond',fx:'Effets',media:'Média'};
$('#tabs').innerHTML=Object.entries(tabs).map(([k,v],i)=>`<button class="tab${i?'':' on'}" data-t="${k}">${v}</button>`).join('');
$('#p-anim').innerHTML=`<h3>Forme animée</h3>${G('g-anim',ANIMS)}<h3>Réglages</h3>${R('speed','Vitesse',.2,3,.05)}${R('lscale','Taille',.3,2.5,.05)}${R('lx','Position X',0,100,1)}${R('ly','Position Y',0,100,1)}${C('accent','Couleur')}${C('c3','Couleur 2')}`;
$('#p-text').innerHTML=`<h3>Titre</h3><div class="f"><input type="text" data-k="text" placeholder="Votre titre"></div><div class="f"><input type="text" data-k="sub" placeholder="Sous-titre"></div><div class="f"><span>Police</span><select data-k="font">${FONTS.map(f=>`<option>${f}</option>`).join('')}</select></div>${R('size','Taille',20,200,1)}${C('tcol','Couleur')}${R('tx','Position X',0,100,1)}${R('ty','Position Y',0,100,1)}<div class="f"><span>Animation</span><select data-k="tanim">${[['none','Aucune'],['slide','Glissement'],['fade','Fondu'],['typewriter','Machine à écrire'],['wave','Vague'],['rainbow','Arc-en-ciel'],['glitch','Glitch'],['neon','Néon']].map(([a,b])=>`<option value="${a}">${b}</option>`).join('')}</select></div>`;
$('#p-bg').innerHTML=`<h3>Style de fond</h3>${G('g-bg',BGS)}<h3>Couleurs</h3>${C('c1','Couleur 1')}${C('c2','Couleur 2')}${R('hue','Teinte',0,360,1)}<h3>Scène</h3>${R('dur','Durée (s)',1,20,.5)}<div class="f"><span>Transition</span><select data-k="trans"><option value="fade">Fondu</option><option value="slide">Glissement</option><option value="zoom">Zoom</option><option value="cut">Coupure</option></select></div>`;
$('#p-fx').innerHTML=`<h3>Particules</h3>${K('snow','❄ Neige')}${K('confetti','Confettis')}${K('sparks','Étincelles')}${K('bubbles','Bulles')}<h3>Image</h3>${K('scan','Lignes CRT')}${R('vig','Vignette',0,1,.01)}${R('grain','Grain',0,.6,.01)}`;
$('#p-media').innerHTML=`<h3>Image ou logo</h3><label class="drop">Importer une image<input type="file" id="fimg" accept="image/*"></label>${K('img','Afficher dans cette scène')}${R('ix','Position X',0,100,1)}${R('iy','Position Y',0,100,1)}${R('isz','Taille',3,100,1)}<h3>Musique</h3><label class="drop">Importer un fichier audio<input type="file" id="faud" accept="audio/*"></label><div id="aud"></div>`;
document.querySelectorAll('[data-k]').forEach(e=>{if(e.type==='range')e.parentElement.querySelector('.v');});

function load(){const s=cur();document.querySelectorAll('[data-k]').forEach(e=>{const v=s[e.dataset.k];if(e.type==='checkbox')e.checked=!!v;else e.value=v;const o=e.parentElement.querySelector('.v');if(o)o.textContent=v});
  document.querySelectorAll('#g-anim .opt').forEach(b=>b.classList.toggle('on',b.dataset.v===s.anim));
  document.querySelectorAll('#g-bg .opt').forEach(b=>b.classList.toggle('on',b.dataset.v===s.bg));strip()}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;const t=e.target,s=cur();
  s[k]=t.type==='checkbox'?+t.checked:(t.type==='range'||t.type==='number')?+t.value:t.value;
  const o=t.parentElement.querySelector('.v');if(o)o.textContent=t.value;if(k==='dur'||k==='c1'||k==='c2'||k==='text')strip();if(k==='dur')timeUI()});
document.addEventListener('click',e=>{const t=e.target;
  if(t.classList.contains('tab')){document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('on'));t.classList.add('on');$('#p-'+t.dataset.t).classList.add('on')}
  if(t.closest('#g-anim')&&t.dataset.v){cur().anim=t.dataset.v;load()}
  if(t.closest('#g-bg')&&t.dataset.v){cur().bg=t.dataset.v;load()}});
function strip(){$('#strip').innerHTML=S.map((s,i)=>`<div class="sc${i===ci?' on':''}" data-i="${i}" style="--a:${s.c1};--b:${s.c2};flex-grow:${s.dur}"><b>${i+1}. ${(s.text||'Sans titre').slice(0,16)}</b><small>${s.dur} s · ${ANIMS[s.anim]}</small></div>`).join('')}
$('#strip').onclick=e=>{const c=e.target.closest('.sc');if(!c)return;ci=+c.dataset.i;T=start(ci)+min(cur().dur*.6,1.5);load();AUD&&(AUD.currentTime=T)};
$('#add').onclick=()=>{S.splice(ci+1,0,Object.assign(def(),{text:'Nouvelle scène'}));ci++;T=start(ci)+1.5;load()};
$('#dup').onclick=()=>{S.splice(ci+1,0,{...cur()});ci++;T=start(ci)+1.5;load()};
$('#del').onclick=()=>{if(S.length<2)return;S.splice(ci,1);ci=min(ci,S.length-1);T=start(ci)+1.5;load()};
$('#left').onclick=()=>{if(ci>0){[S[ci-1],S[ci]]=[S[ci],S[ci-1]];ci--;load()}};
$('#right').onclick=()=>{if(ci<S.length-1){[S[ci+1],S[ci]]=[S[ci],S[ci+1]];ci++;load()}};
$('#res').onchange=e=>{const[w,hh]=e.target.value.split(',').map(Number);cv.width=off.width=w;cv.height=off.height=hh};
$('#theme').onclick=()=>{const d=document.documentElement,n=(d.dataset.theme==='dark')?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('nm-theme',n)}catch(e){}};
(()=>{let t=null;try{t=localStorage.getItem('nm-theme')}catch(e){}document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')})();
$('#fimg').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{IMG=im;cur().img=1;load()};im.src=URL.createObjectURL(f)};
$('#faud').onchange=e=>{const f=e.target.files[0];if(!f)return;AUD=new Audio(URL.createObjectURL(f));AUD.loop=false;$('#aud').innerHTML=`<div class="f"><span>Volume</span><input type="range" min="0" max="1" step=".01" value=".8" id="vol"></div><small style="color:var(--tx2)">${f.name}</small>`;AUD.volume=.8;$('#vol').oninput=ev=>AUD.volume=+ev.target.value;
  ac=ac||new AudioContext();adest=ac.createMediaStreamDestination();const src=ac.createMediaElementSource(AUD);src.connect(ac.destination);src.connect(adest);AUD.currentTime=T};

/* ---------- Lecture ---------- */
function setPlay(p){playing=p;$('#play').textContent=p?'⏸ Pause':'▶ Lire';if(AUD){if(p){if(ac)ac.resume();AUD.currentTime=T;AUD.play().catch(()=>{})}else AUD.pause()}}
$('#play').onclick=()=>setPlay(!playing);
$('#scrub').oninput=e=>{T=e.target.value/1000*tot();if(AUD)AUD.currentTime=T};
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();setPlay(!playing)}if(e.code==='ArrowRight')T=min(tot()-.01,T+1);if(e.code==='ArrowLeft')T=max(0,T-1)});
const fmt=s=>floor(s/60)+':'+String(floor(s%60)).padStart(2,'0');
function timeUI(){$('#time').textContent=fmt(T)+' / '+fmt(tot())}

/* ---------- Rendu ---------- */
const ci_=(c,x,y,r)=>{c.beginPath();c.arc(x,y,r,0,TAU)};
function rot(x,y,z,a,b){const y2=y*cos(a)-z*sin(a),z2=y*sin(a)+z*cos(a);return[x*cos(b)+z2*sin(b),y2,-x*sin(b)+z2*cos(b)]}
const pj=(p)=>{const f=160/(160+p[2]);return[p[0]*f,p[1]*f]};
const A={
pulse(c,t,s){for(let i=5;i>0;i--){const p=sin(t*2-i*.5)*.5+.5;c.globalAlpha=.16+.1*i/5;c.fillStyle=i%2?s.accent:s.c3;ci_(c,0,0,12+i*9+p*5);c.fill()}c.globalAlpha=1;c.fillStyle='#fff';ci_(c,0,0,10+sin(t*3)*2);c.fill()},
rings(c,t,s){c.lineWidth=3;c.lineCap='round';for(let r=0;r<3;r++){c.strokeStyle=r%2?s.c3:s.accent;for(let i=0;i<6;i++){const a=i/6*TAU+t*(r%2?-1:1)*(1+r*.4);c.beginPath();c.arc(0,0,22+r*14,a,a+.7);c.stroke()}}},
orbit(c,t,s){c.fillStyle='#fbbf24';ci_(c,0,0,9);c.fill();[[24,1.4,4],[40,.9,5],[56,.5,6]].forEach(([r,v,z],i)=>{c.strokeStyle=s.accent;c.globalAlpha=.25;c.lineWidth=.6;c.beginPath();c.ellipse(0,0,r,r*.4,0,0,TAU);c.stroke();c.globalAlpha=1;c.fillStyle=i%2?s.c3:s.accent;ci_(c,cos(t*v+i)*r,sin(t*v+i)*r*.4,z);c.fill()})},
bars(c,t,s){for(let i=0;i<15;i++){const v=(sin(t*3+i*.6)*.5+.5)*(sin(t+i*.3)*.3+.7)*70+6;c.fillStyle=i%2?s.c3:s.accent;c.beginPath();c.roundRect(-52+i*7.2,-v/2,4.6,v,2);c.fill()}},
hex(c,t,s){c.lineWidth=2;[16,28,40,52].forEach((r,k)=>{c.strokeStyle=k%2?s.c3:s.accent;c.beginPath();for(let i=0;i<6;i++){const a=i/6*TAU+t*(k%2?-.5:.5);c.lineTo(cos(a)*r,sin(a)*r)}c.closePath();c.stroke()})},
spiral(c,t,s){c.lineWidth=2;c.strokeStyle=s.accent;c.beginPath();for(let i=0;i<260;i++){const a=i*.14+t*1.5,r=i*.22;c.lineTo(cos(a)*r,sin(a)*r)}c.stroke();c.fillStyle=s.c3;ci_(c,cos(t*1.5+36)*57,sin(t*1.5+36)*57,4);c.fill()},
cube(c,t,s){const v=[];for(let i=0;i<8;i++)v.push(pj(rot((i&1?1:-1)*30,(i&2?1:-1)*30,(i&4?1:-1)*30,t*.6,t*.9)));c.lineWidth=2;c.strokeStyle=s.accent;c.lineJoin='round';for(let i=0;i<8;i++)for(let b=0;b<3;b++){const j=i^(1<<b);if(j>i){c.beginPath();c.moveTo(...v[i]);c.lineTo(...v[j]);c.stroke()}}c.fillStyle=s.c3;v.forEach(p=>{ci_(c,p[0],p[1],3);c.fill()})},
torus(c,t,s){const pts=[];for(let i=0;i<28;i++)for(let j=0;j<14;j++){const u=i/28*TAU,v=j/14*TAU,r=34+13*cos(v);pts.push(rot(r*cos(u),13*sin(v),r*sin(u),t*.5+.8,t*.7))}pts.sort((a,b)=>b[2]-a[2]);pts.forEach(p=>{const q=pj(p),b=(p[2]+50)/100;c.globalAlpha=.35+.65*(1-b);c.fillStyle=b<.5?s.accent:s.c3;ci_(c,q[0],q[1],1.9);c.fill()});c.globalAlpha=1},
dna(c,t,s){for(let i=0;i<=24;i++){const y=-56+i*4.7,a=i*.5+t*2,x1=cos(a)*24,x2=-x1;c.strokeStyle=s.accent;c.globalAlpha=.3;c.lineWidth=1;c.beginPath();c.moveTo(x1,y);c.lineTo(x2,y);c.stroke();c.globalAlpha=1;c.fillStyle=s.accent;ci_(c,x1,y,2.6+sin(a)*.8);c.fill();c.fillStyle=s.c3;ci_(c,x2,y,2.6-sin(a)*.8);c.fill()}},
tess(c,t,s){const v=[];for(let i=0;i<16;i++){let x=i&1?1:-1,y=i&2?1:-1,z=i&4?1:-1,w=i&8?1:-1;const p=rot(x,y,z,t*.4,t*.6),xw=p[0]*cos(t*.3)-w*sin(t*.3),ww=p[0]*sin(t*.3)+w*cos(t*.3),f=2.4/(2.4+ww*.6);v.push([xw*f*26,p[1]*f*26])}c.lineWidth=1.6;for(let i=0;i<16;i++)for(let b=0;b<4;b++){const j=i^(1<<b);if(j>i){c.strokeStyle=b%2?s.c3:s.accent;c.beginPath();c.moveTo(...v[i]);c.lineTo(...v[j]);c.stroke()}}},
galaxy(c,t,s){for(let i=0;i<200;i++){const r=sqrt(h(i))*60,a=h(i+7)*TAU+t*(.2+8/(r+8)),x=cos(a)*r,y=sin(a)*r*.45;c.fillStyle=i%3?s.accent:s.c3;c.globalAlpha=.4+.6*h(i+3);ci_(c,x,y,.7+h(i+1)*1.3);c.fill()}c.globalAlpha=1;c.fillStyle='#fff';ci_(c,0,0,4);c.fill()}
};
function drawBG(c,s,t,W,H){const k=s.bg;c.fillStyle=s.c1;c.fillRect(0,0,W,H);
  if(k==='gradient'||k==='radial'){const g=c.createLinearGradient(0,0,W*cos(t*.3)+W/2,H);g.addColorStop(0,s.c1);g.addColorStop(1,s.c2);c.fillStyle=g;c.fillRect(0,0,W,H)}
  else if(k==='mesh'){[[.25,.3,s.c2],[.75,.7,s.c3]].forEach(([x,y,col],i)=>{const cx=W*(x+sin(t*.6+i*2)*.15),cy=H*(y+cos(t*.5+i)*.15),g=c.createRadialGradient(cx,cy,0,cx,cy,W*.55);g.addColorStop(0,col+'cc');g.addColorStop(1,col+'00');c.fillStyle=g;c.fillRect(0,0,W,H)})}
  else if(k==='grid'){c.strokeStyle=s.c2+'44';c.lineWidth=1;const g=W/32,o=(t*12)%g;for(let x=-o;x<W;x+=g){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}for(let y=-o;y<H;y+=g){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}}
  else if(k==='particles'){const P=[];for(let i=0;i<60;i++)P.push([(h(i)*W+sin(t*.4+i)*40+t*8*h(i+1))%W,(h(i+9)*H+cos(t*.3+i)*40)%H]);P.forEach((p,i)=>{c.fillStyle=s.c2;ci_(c,p[0],p[1],2*W/1280);c.fill();for(let j=i+1;j<60;j++){const d=Math.hypot(p[0]-P[j][0],p[1]-P[j][1]);if(d<W*.1){c.strokeStyle=s.c2;c.globalAlpha=1-d/(W*.1);c.beginPath();c.moveTo(...p);c.lineTo(...P[j]);c.stroke();c.globalAlpha=1}}})}
  else if(k==='aurora'){for(let i=0;i<4;i++){c.beginPath();for(let x=0;x<=W;x+=12){const y=H*.45+sin(x/W*4+t*(.6+i*.2)+i)*H*.12+sin(x/W*9+t+i)*H*.04;x?c.lineTo(x,y):c.moveTo(x,y)}c.lineTo(W,H);c.lineTo(0,H);const g=c.createLinearGradient(0,H*.3,0,H);g.addColorStop(0,(i%2?s.c3:s.c2)+'66');g.addColorStop(1,'#0000');c.fillStyle=g;c.fill()}}
  else if(k==='stars'){for(let i=0;i<160;i++){c.fillStyle='#fff';c.globalAlpha=.25+.75*(sin(t*2+i*3)*.5+.5);ci_(c,h(i)*W,h(i+5)*H,(.5+h(i+2)*1.6)*W/1280);c.fill()}c.globalAlpha=1}
  else if(k==='waves'){for(let i=0;i<6;i++){c.beginPath();for(let x=0;x<=W;x+=8){const y=H*.55+sin(x/W*5+t+i*.7)*(H*.04+i*H*.015);x?c.lineTo(x,y):c.moveTo(x,y)}c.lineTo(W,H);c.lineTo(0,H);c.fillStyle=(i%2?s.c3:s.c2)+'22';c.fill()}}
  else if(k==='plasma'){const w=W/48,hh=H/27;for(let y=0;y<27;y++)for(let x=0;x<48;x++){const v=sin(x/6+t)+sin(y/5+t*1.2)+sin((x+y)/9+t*.8);c.fillStyle=`hsl(${220+v*30},70%,${28+v*6}%)`;c.fillRect(x*w,y*hh,w+1,hh+1)}}}
function txt(c,s,x,y,sz,wt,col,an,t){c.font=`${wt} ${sz}px "${cur().font}",system-ui,sans-serif`;c.fillStyle=col;const p=min(1,t/.9),e=1-Math.pow(1-p,3);c.save();c.shadowColor='rgba(0,0,0,.3)';c.shadowBlur=sz*.3;
  if(an==='typewriter'){const n=floor(min(1,t/(s.length*.07+.01))*s.length),w=c.measureText(s).width;c.textAlign='left';c.fillText(s.slice(0,n),x-w/2,y)}
  else if(an==='wave'||an==='rainbow'){const w=c.measureText(s).width;let cx=x-w/2;c.textAlign='left';[...s].forEach((ch,i)=>{if(an==='rainbow')c.fillStyle=`hsl(${(i*28+t*90)%360},85%,66%)`;c.fillText(ch,cx,y+(an==='wave'?sin(t*3+i*.6)*sz*.12:0));cx+=c.measureText(ch).width})}
  else if(an==='glitch'){const j=sin(t*9)>.7?sz*.04:sz*.01;c.fillStyle='rgba(255,40,80,.7)';c.fillText(s,x-j,y);c.fillStyle='rgba(40,220,255,.7)';c.fillText(s,x+j,y);c.fillStyle=col;c.fillText(s,x,y)}
  else if(an==='neon'){c.shadowColor=col;for(let i=3;i>0;i--){c.shadowBlur=sz*.18*i*(.8+.2*sin(t*6));c.fillText(s,x,y)}}
  else if(an==='slide'){c.globalAlpha=e;c.fillText(s,x,y+(1-e)*sz*.6)}
  else if(an==='fade'){c.globalAlpha=e;c.fillText(s,x,y)}
  else c.fillText(s,x,y);c.restore()}
function render(c,s,t,W,H){c.save();c.clearRect(0,0,W,H);const ts=t*s.speed;
  c.filter=s.hue?`hue-rotate(${s.hue}deg)`:'none';drawBG(c,s,ts,W,H);
  const u=min(W,H)/150*s.lscale;c.save();c.translate(s.lx/100*W,s.ly/100*H);c.scale(u,u);A[s.anim](c,ts,s);c.restore();c.filter='none';
  if(s.img&&IMG){const w=W*s.isz/100,hh=w*IMG.height/IMG.width;c.drawImage(IMG,s.ix/100*W-w/2,s.iy/100*H-hh/2,w,hh)}
  c.textAlign='center';c.textBaseline='middle';const sz=s.size*W/1280;
  if(s.text)txt(c,s.text,s.tx/100*W,s.ty/100*H,sz,800,s.tcol,s.tanim,t);
  if(s.sub)txt(c,s.sub,s.tx/100*W,s.ty/100*H+sz*.85,sz*.34,400,s.tcol,s.tanim==='typewriter'?'fade':s.tanim==='wave'||s.tanim==='rainbow'?'slide':s.tanim,max(0,t-.3));
  const k=W/1280;
  if(s.snow){c.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<110;i++){ci_(c,h(i)*W+sin(t+i)*20,((t*(30+h(i+9)*60)*k+h(i+3)*H)%(H+20))-10,(1+h(i+5)*3)*k);c.fill()}}
  if(s.confetti){for(let i=0;i<70;i++){c.save();c.translate(h(i)*W+sin(t+i)*30,((t*(70+h(i+4)*90)*k+h(i+2)*H)%(H+30))-15);c.rotate(t*3*h(i+8)+i);c.fillStyle=`hsl(${h(i+6)*360},85%,62%)`;c.fillRect(-5*k,-3*k,10*k,6*k);c.restore()}}
  if(s.sparks){for(let i=0;i<80;i++){const l=(t*.5+h(i))%1,a=h(i+1)*TAU,r=l*W*.3*(.4+h(i+2));c.fillStyle=`hsla(${35+h(i+3)*30},100%,70%,${1-l})`;ci_(c,W/2+cos(a)*r,H*.6+sin(a)*r-l*l*H*.2+l*l*H*.25,2.2*k);c.fill()}}
  if(s.bubbles){c.strokeStyle='rgba(150,200,255,.5)';c.lineWidth=1.5;for(let i=0;i<40;i++){const l=(t*.12*(.5+h(i))+h(i+2))%1;ci_(c,h(i+1)*W+sin(t+i)*20,H*(1.1-l*1.25),(6+h(i+3)*22)*k);c.stroke()}}
  if(s.scan){c.fillStyle='rgba(0,0,0,.18)';for(let y=0;y<H;y+=4)c.fillRect(0,y,W,1.5)}
  if(s.grain>0){c.globalAlpha=s.grain;for(let i=0;i<500;i++){c.fillStyle=Math.random()>.5?'#fff':'#000';c.fillRect(Math.random()*W,Math.random()*H,2,2)}c.globalAlpha=1}
  if(s.vig>0){const g=c.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,max(W,H)*.7);g.addColorStop(0,'#0000');g.addColorStop(1,`rgba(0,0,0,${s.vig})`);c.fillStyle=g;c.fillRect(0,0,W,H)}
  c.restore()}
function frame(){const W=cv.width,H=cv.height,[i,lt]=loc(T),s=S[i];
  if(i!==ci&&(playing||exporting)){ci=i;load()}
  render(X,s,lt,W,H);const td=.6;
  if(i>0&&lt<td&&s.trans!=='cut'){render(O,S[i-1],S[i-1].dur+lt,W,H);const p=lt/td;X.save();
    if(s.trans==='fade'){X.globalAlpha=1-p;X.drawImage(off,0,0)}
    else if(s.trans==='slide')X.drawImage(off,-p*W,0);
    else{X.translate(W/2,H/2);X.scale(1+p*.4,1+p*.4);X.globalAlpha=1-p;X.drawImage(off,-W/2,-H/2)}X.restore()}
  timeUI();if(document.activeElement!==$('#scrub'))$('#scrub').value=T/tot()*1000}
let last=0;function loop(ts){const dt=min(.05,(ts-last)/1000);last=ts;
  if(playing){T+=dt;if(T>=tot()){if(exporting)finishExport();else{T=0;if(AUD){AUD.currentTime=0}}}}
  if(exporting)$('#pbar').style.width=(T/tot()*100)+'%';
  frame();requestAnimationFrame(loop)}

/* ---------- Export ---------- */
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
$('#png').onclick=()=>cv.toBlob(b=>dl(b,'novamotion.png'));
$('#exp').onclick=()=>{if(exporting)return;if(!window.MediaRecorder){alert('Votre navigateur ne prend pas en charge l’export vidéo. Essayez Chrome, Edge ou Firefox.');return}
  T=0;chunks=[];const st=cv.captureStream(30);if(AUD&&adest)adest.stream.getAudioTracks().forEach(t=>st.addTrack(t));
  const m=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));
  mr=new MediaRecorder(st,{mimeType:m,videoBitsPerSecond:8e6});mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=()=>{dl(new Blob(chunks,{type:'video/webm'}),'novamotion.webm');$('#prog').style.display='none'};
  mr.start(200);exporting=true;$('#prog').style.display='block';$('#pmsg').textContent='Export en cours… ne changez pas d’onglet';setPlay(true)};
function finishExport(){exporting=false;setPlay(false);T=0;setTimeout(()=>mr.stop(),150)}

load();timeUI();requestAnimationFrame(ts=>{last=ts;loop(ts)});
</script>

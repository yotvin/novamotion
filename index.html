<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaMotion Pro Studio</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0d0d0d;
color:white;
font-family:Arial,sans-serif;
overflow:hidden;
}

header{
height:60px;
background:#171717;
display:flex;
align-items:center;
justify-content:space-between;
padding:10px 20px;
border-bottom:2px solid #2a2a2a;
}

header h1{
margin:0;
font-size:22px;
}

.toolbar{
display:flex;
gap:10px;
flex-wrap:wrap;
}

button,input{
border:none;
border-radius:6px;
padding:8px;
}

button{
background:#2563eb;
color:white;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

#layout{
display:grid;
grid-template-columns:300px 1fr;
height:calc(100vh - 60px);
}

#sidebar{
background:#141414;
border-right:2px solid #252525;
overflow:auto;
padding:15px;
}

.panel{
background:#1e1e1e;
padding:12px;
border-radius:10px;
margin-bottom:15px;
}

.panel h2{
margin-top:0;
font-size:18px;
}

#workspace{
display:flex;
flex-direction:column;
height:100%;
}

#previewZone{
flex:1;
display:flex;
align-items:center;
justify-content:center;
background:#000;
position:relative;
}

canvas{
background:#111;
border:3px solid #333;
}

#timeline{
height:260px;
background:#101010;
border-top:2px solid #2a2a2a;
overflow:auto;
padding:10px;
}

.track{
background:#1f1f1f;
padding:10px;
border-radius:8px;
margin-bottom:10px;
}

.clip{
display:inline-block;
background:#2563eb;
padding:8px;
margin:4px;
border-radius:6px;
cursor:pointer;
}

#scenesBar{
display:flex;
gap:10px;
overflow-x:auto;
padding:10px;
background:#151515;
border-top:2px solid #2a2a2a;
}

.sceneThumb{
min-width:180px;
height:100px;
background:#222;
border:2px solid #444;
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
position:relative;
}

.sceneThumb:hover{
border-color:#2563eb;
}

.sceneLabel{
position:absolute;
bottom:5px;
left:5px;
font-size:12px;
background:#000;
padding:2px 6px;
border-radius:4px;
}

input[type=color],
input[type=range],
textarea{
width:100%;
}

textarea{
height:70px;
background:#111;
color:white;
border:1px solid #444;
padding:10px;
}

.small{
font-size:12px;
color:#bbb;
}

.mediaList{
max-height:180px;
overflow:auto;
}

.mediaItem{
background:#262626;
padding:8px;
border-radius:6px;
margin-bottom:8px;
font-size:13px;
}

audio{
width:100%;
margin-top:10px;
}

</style>
</head>
<body>

<header>
<h1>NovaMotion Pro Studio</h1>

<div class="toolbar">
<button onclick="addTextLayer()">Texte</button>
<button onclick="addImageLayer()">Image</button>
<button onclick="addTransition()">Transition</button>
<button onclick="playAnimation()">Lecture</button>
<button onclick="exportPNG()">Exporter PNG</button>
<button onclick="startRecording()">REC</button>
<button onclick="stopRecording()">STOP</button>
</div>
</header>

<div id="layout">

<div id="sidebar">

<div class="panel">
<h2>Texte</h2>

<textarea id="textContent">Titre du Journal TV</textarea>

<label>Taille</label>
<input type="range" id="fontSize" min="20" max="120" value="54">

<label>Couleur</label>
<input type="color" id="textColor" value="#ffffff">

<button style="width:100%;margin-top:10px;" onclick="updateText()">Appliquer</button>
</div>

<div class="panel">
<h2>Importer un logo</h2>

<input type="file" id="logoInput" accept="image/*">

<div class="small">
Importez des PNG, JPG ou logos transparents.
</div>
</div>

<div class="panel">
<h2>Importer musique</h2>

<input type="file" id="musicInput" accept="audio/*">

<div id="audioContainer"></div>
</div>

<div class="panel">
<h2>Fond</h2>

<input type="color" id="bgColor" value="#111111">

<button style="width:100%;margin-top:10px;" onclick="changeBackground()">Changer fond</button>
</div>

<div class="panel">
<h2>Transitions</h2>

<button style="width:100%;margin-bottom:10px;" onclick="transitionFade()">Fade</button>

<button style="width:100%;margin-bottom:10px;" onclick="transitionSlide()">Slide</button>

<button style="width:100%;" onclick="transitionZoom()">Zoom</button>
</div>

<div class="panel">
<h2>Médias importés</h2>
<div class="mediaList" id="mediaList"></div>
</div>

</div>

<div id="workspace">

<div id="previewZone">
<canvas id="canvas" width="1280" height="720"></canvas>
</div>

<div id="timeline">

<div class="track">
<strong>Piste vidéo</strong>
<div class="clip">Scène 1</div>
<div class="clip">Scène 2</div>
<div class="clip">Transition Fade</div>
</div>

<div class="track">
<strong>Piste texte</strong>
<div class="clip">Titre principal</div>
</div>

<div class="track">
<strong>Piste audio</strong>
<div class="clip">Musique ambiance</div>
</div>

</div>

<div id="scenesBar">

<div class="sceneThumb" onclick="selectScene(1)">
<div class="sceneLabel">Scène 1</div>
</div>

<div class="sceneThumb" onclick="selectScene(2)">
<div class="sceneLabel">Scène 2</div>
</div>

<div class="sceneThumb" onclick="selectScene(3)">
<div class="sceneLabel">Transition</div>
</div>

</div>

</div>
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let bgColor = "#111111";
let textValue = "Titre du Journal TV";
let fontSize = 54;
let textColor = "#ffffff";

let logoImage = null;

let textX = 100;
let logoX = 900;
let logoY = 200;

let recording = false;
let mediaRecorder;
let recordedChunks = [];

function render(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle = bgColor;
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle = textColor;
ctx.font = fontSize + "px Arial";
ctx.fillText(textValue,textX,140);

if(logoImage){
ctx.drawImage(logoImage,logoX,logoY,220,220);
}

requestAnimationFrame(render);

}

render();

function updateText(){

textValue = document.getElementById("textContent").value;
fontSize = document.getElementById("fontSize").value;
textColor = document.getElementById("textColor").value;

}

function changeBackground(){

bgColor = document.getElementById("bgColor").value;

}

document.getElementById("logoInput").addEventListener("change",(e)=>{

const file = e.target.files[0];

if(file){

const reader = new FileReader();

reader.onload = function(event){

logoImage = new Image();

logoImage.src = event.target.result;

};

reader.readAsDataURL(file);

const media = document.createElement("div");
media.className = "mediaItem";
media.innerHTML = "🖼️ " + file.name;

document.getElementById("mediaList").appendChild(media);

}

});

document.getElementById("musicInput").addEventListener("change",(e)=>{

const file = e.target.files[0];

if(file){

const url = URL.createObjectURL(file);

const audio = document.createElement("audio");
audio.controls = true;
audio.src = url;

document.getElementById("audioContainer").innerHTML = "";
document.getElementById("audioContainer").appendChild(audio);

const media = document.createElement("div");
media.className = "mediaItem";
media.innerHTML = "🎵 " + file.name;

document.getElementById("mediaList").appendChild(media);

}

});

function addTextLayer(){

const clip = document.createElement("div");
clip.className = "clip";
clip.innerHTML = "Nouveau Texte";

document.querySelectorAll(".track")[1].appendChild(clip);

}

function addImageLayer(){

const clip = document.createElement("div");
clip.className = "clip";
clip.innerHTML = "Image";

document.querySelectorAll(".track")[0].appendChild(clip);

}

function addTransition(){

const clip = document.createElement("div");
clip.className = "clip";
clip.innerHTML = "Transition";

document.querySelectorAll(".track")[0].appendChild(clip);

}

function playAnimation(){

let step = 0;

const anim = setInterval(()=>{

textX += 8;
logoX -= 4;

step++;

if(step > 180){

clearInterval(anim);

textX = 100;
logoX = 900;

}

},16);

}

function transitionFade(){

let opacity = 1;

const fade = setInterval(()=>{

ctx.globalAlpha = opacity;

opacity -= 0.02;

if(opacity <= 0){

ctx.globalAlpha = 1;
clearInterval(fade);

}

},16);

}

function transitionSlide(){

let pos = -1280;

const slide = setInterval(()=>{

ctx.fillStyle = "#000";
ctx.fillRect(pos,0,1280,720);

pos += 30;

if(pos > 1280){

clearInterval(slide);

}

},16);

}

function transitionZoom(){

let zoom = 1;

const z = setInterval(()=>{

ctx.save();
ctx.scale(zoom,zoom);

zoom += 0.01;

ctx.restore();

if(zoom > 2){

clearInterval(z);

}

},16);

}

function exportPNG(){

const link = document.createElement("a");

link.download = "novamotion_frame.png";

link.href = canvas.toDataURL();

link.click();

}

function startRecording(){

const stream = canvas.captureStream(30);

mediaRecorder = new MediaRecorder(stream,{
mimeType:"video/webm"
});

recordedChunks = [];

mediaRecorder.ondataavailable = e=>{

if(e.data.size > 0){
recordedChunks.push(e.data);
}

};

mediaRecorder.onstop = ()=>{

const blob = new Blob(recordedChunks,{
type:"video/webm"
});

const url = URL.createObjectURL(blob);

const a = document.createElement("a");

a.href = url;
a.download = "novamotion_video.webm";

a.click();

};

mediaRecorder.start();

}

function stopRecording(){

if(mediaRecorder){
mediaRecorder.stop();
}

}

function selectScene(id){

alert("Scène sélectionnée : " + id);

}

</script>

</body>
</html>

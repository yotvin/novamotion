<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>NovaMotion Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#f0f0f0;font-family:'Segoe UI',Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:50px;background:#161616;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;gap:8px;padding:0 14px;flex-shrink:0}
header h1{font-size:15px;font-weight:700;color:#fff;margin-right:4px}
.hbtn{background:#222;border:1px solid #333;color:#ddd;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap;transition:background .1s}
.hbtn:hover{background:#2c2c2c}
.hbtn.play{background:#1a3a1a;border-color:#2d6a2d;color:#6fef6f}
.hbtn.rec{background:#3a1a1a;border-color:#7a2a2a;color:#ef6f6f}
.hbtn.rec.active{animation:recpulse 1s infinite}
@keyframes recpulse{0%,100%{background:#5a1a1a}50%{background:#2a1a1a}}
.spacer{flex:1}
#fpsLabel{font-size:11px;color:#555;min-width:42px}
#layout{display:flex;flex:1;overflow:hidden}
#sidebar{width:270px;background:#111;border-right:1px solid #222;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar-scroll{flex:1;overflow-y:auto;padding:10px}
.sidebar-scroll::-webkit-scrollbar{width:4px}.sidebar-scroll::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}
.sec{margin-bottom:14px}
.sec-head{font-size:10px;font-weight:700;color:#444;letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px;padding-left:2px}
.row{display:flex;gap:6px;align-items:center;margin-bottom:5px}
label.lbl{font-size:11px;color:#666;white-space:nowrap;min-width:54px}
input[type=range]{flex:1;accent-color:#3b82f6;height:3px}
input[type=color]{width:30px;height:24px;border:1px solid #333;border-radius:4px;background:none;cursor:pointer;padding:0}
input[type=text],select,textarea{width:100%;background:#0a0a0a;border:1px solid #252525;color:#e0e0e0;border-radius:5px;padding:6px 8px;font-size:12px;margin-bottom:4px}
textarea{height:48px;resize:none}
.val{font-size:11px;color:#3b82f6;min-width:26px;text-align:right}
.sbtn{background:#1a1a1a;border:1px solid #2a2a2a;color:#bbb;padding:5px 0;border-radius:5px;cursor:pointer;font-size:11px;flex:1;text-align:center;transition:all .1s}
.sbtn:hover{border-color:#3b82f6;color:#fff}
.sbtn.on{background:#1a2a3a;border-color:#3b82f6;color:#93c5fd}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:4px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:4px}

/* ANIM GRID */
.cat-label{font-size:10px;color:#555;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:8px 0 4px;padding-left:1px}
.anim-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:4px}
.anim-card{background:#151515;border:1px solid #222;border-radius:5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px 2px;transition:all .12s}
.anim-card:hover{border-color:#3a3a3a}
.anim-card.sel{border-color:#3b82f6;background:#0c1a2e}
.anim-card canvas{width:46px;height:46px;border-radius:3px;background:#0a0a0a;display:block}
.anim-card span{font-size:8px;color:#555;text-align:center;line-height:1.2}
.anim-card.sel span{color:#93c5fd}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#0a0a0a}
#canvasWrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#mainCanvas{background:#111;border:1px solid #1e1e1e;display:block;max-width:100%;max-height:100%}
#timecodeBox{position:absolute;bottom:8px;right:10px;font-size:11px;color:#444;font-family:monospace;background:rgba(0,0,0,.6);padding:2px 7px;border-radius:4px;pointer-events:none}
#scenesStrip{height:80px;background:#0e0e0e;border-top:1px solid #1e1e1e;display:flex;align-items:center;gap:7px;padding:0 10px;overflow-x:auto;flex-shrink:0}
.scene-card{position:relative;min-width:110px;height:62px;border-radius:6px;border:2px solid #2a2a2a;cursor:pointer;overflow:hidden;flex-shrink:0;transition:border-color .15s}
.scene-card canvas{width:100%;height:100%;display:block}
.scene-card:hover{border-color:#444}.scene-card.active{border-color:#3b82f6}
.scene-label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);font-size:9px;text-align:center;padding:2px;color:#aaa}
.scene-del{position:absolute;top:2px;right:3px;color:#f55;font-size:10px;cursor:pointer;display:none}
.scene-card:hover .scene-del{display:block}
.add-scene-btn{min-width:60px;height:62px;border-radius:6px;border:1px dashed #2a2a2a;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#3a3a3a;font-size:22px;flex-shrink:0;transition:all .15s}
.add-scene-btn:hover{border-color:#3b82f6;color:#3b82f6}
#meter{display:flex;gap:1px;align-items:flex-end;height:28px;padding:4px 0}
.mbar{width:7px;background:#22c55e;border-radius:1px;transition:height .05s}
.drop-zone{border:1px dashed #252525;border-radius:5px;padding:9px;text-align:center;font-size:11px;color:#444;cursor:pointer;margin-bottom:6px;transition:border-color .15s}
.drop-zone:hover{border-color:#3b82f6;color:#666}
.drop-zone input{display:none}
</style>
</head>
<body>
<header>
  <h1>⬡ NovaMotion</h1>
  <button class="hbtn play" id="playBtn" onclick="togglePlay()">▶ Lire</button>
  <button class="hbtn rec" id="recBtn" onclick="toggleRec()">⏺ REC</button>
  <button class="hbtn" onclick="exportPNG()">📷 PNG</button>
  <button class="hbtn" onclick="exportWEBM()">🎬 Export</button>
  <div class="spacer"></div>
  <select style="background:#1a1a1a;border:1px solid #2a2a2a;color:#ccc;border-radius:5px;padding:4px 7px;font-size:11px" onchange="setRes(this.value)">
    <option value="1280,720">1280×720</option><option value="1920,1080">1920×1080</option>
    <option value="720,720">720×720</option><option value="1080,1920">1080×1920</option>
  </select>
  <span id="fpsLabel" style="font-size:11px;color:#444;min-width:42px">60 fps</span>
</header>

<div id="layout">
<div id="sidebar">
<div class="sidebar-scroll">

  <div class="sec">
    <div class="sec-head">Animation logo</div>
    <div id="animContainer"></div>
  </div>

  <div class="sec">
    <div class="sec-head">Texte</div>
    <textarea id="txtContent" placeholder="Votre texte…">NovaMotion</textarea>
    <div class="row"><label class="lbl">Police</label>
      <select id="txtFont" style="flex:1">
        <option>Arial Black</option><option>Impact</option><option>Georgia</option>
        <option>Courier New</option><option>Trebuchet MS</option><option>Verdana</option>
      </select>
    </div>
    <div class="row"><label class="lbl">Taille</label>
      <input type="range" id="txtSize" min="14" max="160" value="72" step="1" oninput="document.getElementById('tsv').textContent=this.value">
      <span class="val" id="tsv">72</span>
    </div>
    <div class="row"><label class="lbl">Couleur</label><input type="color" id="txtColor" value="#ffffff">
      <label class="lbl" style="margin-left:6px">Fond</label><input type="color" id="bgColor" value="#0a0a0a">
    </div>
    <div class="row"><label class="lbl">X</label><input type="range" id="txtX" min="0" max="100" value="50" step="1">
      <label class="lbl">Y</label><input type="range" id="txtY" min="0" max="100" value="52" step="1"></div>
    <div class="row"><label class="lbl">Anim</label>
      <select id="txtAnim" style="flex:1">
        <option value="none">Aucune</option><option value="typewriter">Machine à écrire</option>
        <option value="wave">Vague</option><option value="glitch">Glitch</option>
        <option value="rainbow">Arc-en-ciel</option><option value="neon">Néon</option>
      </select>
    </div>
  </div>

  <div class="sec">
    <div class="sec-head">Fond</div>
    <div class="row"><label class="lbl">Type</label>
      <select id="bgType" style="flex:1" onchange="S.bgType=this.value">
        <option value="solid">Uni</option><option value="gradient">Dégradé</option>
        <option value="grid">Grille</option><option value="dots">Points</option>
        <option value="particles">Particules</option><option value="waves">Vagues</option>
      </select>
    </div>
    <div class="row"><label class="lbl">Couleur 2</label><input type="color" id="bg2Color" value="#1a1a2e"></div>
  </div>

  <div class="sec">
    <div class="sec-head">Effets</div>
    <div class="grid3">
      <button class="sbtn" id="btnSnow" onclick="toggleFX('snow',this)">❄ Neige</button>
      <button class="sbtn" id="btnFW" onclick="toggleFX('fireworks',this)">★ Feux</button>
      <button class="sbtn" id="btnRain" onclick="toggleFX('rain',this)">〰 Pluie</button>
      <button class="sbtn" id="btnSpark" onclick="toggleFX('sparks',this)">✦ Étinc.</button>
      <button class="sbtn" id="btnLens" onclick="toggleFX('lens',this)">◎ Lens</button>
      <button class="sbtn" onclick="clearFX()">✕ Effacer</button>
    </div>
    <div class="row"><label class="lbl">Vignette</label>
      <input type="range" id="vigAmt" min="0" max="1" value="0" step=".01">
    </div>
  </div>

  <div class="sec">
    <div class="sec-head">Logo / Image</div>
    <div class="drop-zone" onclick="document.getElementById('imgFile').click()">
      Importer image ou logo
      <input type="file" id="imgFile" accept="image/*" onchange="loadImg(this)">
    </div>
    <div id="imgControls" style="display:none">
      <div class="row"><label class="lbl">X</label><input type="range" id="imgX" min="0" max="100" value="50" step="1">
        <label class="lbl">Y</label><input type="range" id="imgY" min="0" max="100" value="50" step="1"></div>
      <div class="row"><label class="lbl">Taille</label><input type="range" id="imgScale" min="5" max="200" value="40" step="1"></div>
      <div class="row"><label class="lbl">Rotation</label><input type="range" id="imgRot" min="-180" max="180" value="0" step="1"></div>
      <div class="row"><label class="lbl">Anim</label>
        <select id="imgAnim" style="flex:1">
          <option value="none">Aucune</option><option value="spin">Rotation</option>
          <option value="float">Lévitation</option><option value="pulse">Pulse</option>
          <option value="bounce">Rebond</option><option value="shake">Secousse</option>
        </select>
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-head">Musique</div>
    <div class="drop-zone" onclick="document.getElementById('audioFile').click()">
      Importer audio
      <input type="file" id="audioFile" accept="audio/*" onchange="loadAudio(this)">
    </div>
    <div id="audioPlayer"></div>
    <div class="row"><label class="lbl">Volume</label>
      <input type="range" id="volRange" min="0" max="1" value="0.8" step=".01" oninput="if(S.audioEl)S.audioEl.volume=this.value">
    </div>
    <div id="meter"></div>
  </div>

</div>
</div>

<div id="main">
  <div id="canvasWrap">
    <canvas id="mainCanvas" width="1280" height="720"></canvas>
    <div id="timecodeBox">00:00:00</div>
  </div>
  <div id="scenesStrip">
    <div class="add-scene-btn" onclick="addScene()" title="Nouvelle scène">+</div>
  </div>
</div>
</div>

<script>
// ══════════════════════════════════════════════════════
// HELPERS MATH
// ══════════════════════════════════════════════════════
const PI=Math.PI, TAU=PI*2;
const sin=Math.sin, cos=Math.cos, abs=Math.abs, sqrt=Math.sqrt;
const lerp=(a,b,t)=>a+(b-a)*t;

// ══════════════════════════════════════════════════════
// ÉTAT
// ══════════════════════════════════════════════════════
const C=document.getElementById('mainCanvas');
const ctx=C.getContext('2d');

let S={
  playing:false,recording:false,t:0,frame:0,lastTS:0,
  fpsA:0,fpsN:0,
  bgType:'solid',bgColor:'#0a0a0a',bg2:'#1a1a2e',
  logoAnim:'flat_pulse',
  imgObj:null,
  fx:{snow:false,fireworks:false,rain:false,sparks:false,lens:false},
  snow:[],rain:[],sparks:[],fireworks:[],lensX:0,
  _pts:null,matrixCols:null,
  scenes:[],currentScene:0,
  audioEl:null,analyser:null,audioCtx:null,
  mediaRec:null,recChunks:[],
};

// ══════════════════════════════════════════════════════
// 50+ ANIMATIONS  (flat, 2d, 3d)
// ══════════════════════════════════════════════════════

/* ────── FLAT (18) ────── */
function flat_pulse(c,t,W,H){
  const cx=W/2,cy=H/2,p=sin(t*2)*.5+.5;
  clr(c,W,H);
  for(let i=4;i>=0;i--){circle(c,cx,cy,(28+i*16)*(1+p*.12),`hsla(${210+i*14},80%,${40+p*22}%,${.1+i*.05})`,true)}
  circle(c,cx,cy,20*(1+p*.1),`hsl(${210+p*30},90%,${62+p*18}%)`,true);
}
function flat_hex(c,t,W,H){
  const cx=W/2,cy=H/2;clr(c,W,H);
  [28,44,60].forEach((r,i)=>{ngon(c,cx,cy,r,6,t*.4+i*.3,`hsl(${200+i*22},85%,${55+i*8}%)`,false,2+i*.5)});
  circle(c,cx,cy,10,'#60a5fa',true);
}
function flat_ring(c,t,W,H){
  const cx=W/2,cy=H/2;clr(c,W,H);
  for(let i=0;i<14;i++){const a=i/14*TAU+t,a2=(i+.65)/14*TAU+t;arc(c,cx,cy,36,a,a2,`hsl(${i/14*360+t*30}%,90%,65%)`.replace('%',''),7)}
  circle(c,cx,cy,13,'#fff',true);
}
function flat_bars(c,t,W,H){
  clr(c,W,H);const bars=9,bw=7,gap=5,tot=bars*(bw+gap),ox=W/2-tot/2;
  for(let i=0;i<bars;i++){const h=(sin(t*2+i*.65)*.5+.5)*H*.7+12;c.fillStyle=`hsl(${200+i*14},80%,58%)`;c.fillRect(ox+i*(bw+gap),H/2-h/2,bw,h)}
}
function flat_tri(c,t,W,H){
  const cx=W/2,cy=H/2;clr(c,W,H);
  [20,33,46].forEach((r,k)=>ngon(c,cx,cy,r,3,t*(.45+k*.3)+k,`hsl(${180+k*40},85%,58%)`,false,2+k*.6));
}
function flat_wave(c,t,W,H){
  clr(c,W,H);
  for(let w=0;w<5;w++){c.beginPath();for(let x=0;x<=W;x+=3){const y=H/2+sin(x/10+t*(1+w*.4)+w)*14*(1+w*.6);x===0?c.moveTo(x,y):c.lineTo(x,y);}c.strokeStyle=`hsla(${210+w*22},85%,${55+w*7}%,${.85-w*.14})`;c.lineWidth=2;c.stroke()}
}
function flat_starburst(c,t,W,H){
  const cx=W/2,cy=H/2;clr(c,W,H);
  c.save();c.translate(cx,cy);c.rotate(t*.5);
  for(let i=0;i<12;i++){const a=i/12*TAU;c.beginPath();c.moveTo(0,0);c.lineTo(cos(a)*44,sin(a)*44);c.strokeStyle=`hsl(${i/12*360},90%,65%)`;c.lineWidth=3;c.stroke();}
  c.restore();circle(c,cx,cy,12,'#fff',true);
}
function flat_loader(c,t,W,H){
  const cx=W/2,cy=H/2;clr(c,W,H);
  for(let i=0;i<8;i++){const a=i/8*TAU,f=(t*2+i/8*TAU)%(TAU),alpha=f>PI?0.1:0.1+(1-f/PI)*.85;circle(c,cx+cos(a)*30,cy+sin(a)*30,6,`rgba(96,165,250,${alpha})`,true);}
}
function flat_diamond(c,t,W,H){
  const cx=W/2,cy=H/2;clr(c,W,H);
  [40,28,16].forEach((r,i)=>{ngon(c,cx,cy,r,4,t*.6+i*PI/4+PI/4,`hsl(${200+i*30},80%,${55+i*10}%)`,i===2,2)});
}
function flat_circuit(c,t,W,H){
  clr(c,W,H);
  const lines=[[W/2-50,H/2,W/2+50,H/2],[W/2,H/2-50,W/2,H/2+50],[W/2-50,H/2-30,W/2-50,H/2+30],[W/2+50,H/2-30,W/2+50,H/2+30]];
  lines.forEach(([x1,y1,x2,y2])=>{c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle='#1d4ed8';c.lineWidth=3;c.stroke();});
  const dots=[[W/2-50,H/2],[W/2+50,H/2],[W/2,H/2-50],[W/2,H/2+50]];
  dots.forEach(([x,y],i)=>{const r=5+sin(t*2+i)*2;circle(c,x,y,r,`hsl(${210+i*30},90%,65%)`,true)});
  circle(c,W/2,H/2,10,'#60a5fa',true);
}
function flat_equalizer(c,t,W,H){
  clr(c,W,H);const n=11,bw=8,gap=4,tot=n*(bw+gap),ox=W/2-tot/2;
  for(let i=0;i<n;i++){const h=(sin(t*3+i*.8+sin(t+i))*.5+.5)*H*.65+8;const hue=200+i*12;c.fillStyle=`hsl(${hue},85%,55%)`;c.fillRect(ox+i*(bw+gap),H/2-h/2,bw,h/2);c.fillStyle=`hsl(${hue},85%,40%)`;c.fillRect(ox+i*(bw+gap),H/2,bw,h/2);}
}
function flat_fingerprint(c,t,W,H){
  const cx=W/2,cy=H/2;clr(c,W,H);
  for(let i=1;i<=8;i++){const phase=sin(t+i)*.08;c.beginPath();c.ellipse(cx,cy,i*8,i*5,t*.1+phase,0,TAU);c.strokeStyle=`hsla(${200+i*10},80%,55%,${.8-i*.07})`;c.lineWidth=1.5;c.stroke();}
}
function flat_snowflake(c,t,W,H){
  const cx=W/2,cy=H/2;clr(c,W,H);c.save();c.translate(cx,cy);c.rotate(t*.3);
  for(let i=0;i<6;i++){c.save();c.rotate(i/6*TAU);c.beginPath();c.moveTo(0,0);c.lineTo(0,-38);c.strokeStyle='#93c5fd';c.lineWidth=2;c.stroke();[-14,-24].forEach(y=>{c.beginPath();c.moveTo(0,y);c.lineTo(8,y-8);c.moveTo(0,y);c.lineTo(-8,y-8);c.stroke();});c.restore();}
  c.restore();circle(c,cx,cy,7,'#60a5fa',true);
}
function flat_target(c,t,W,H){
  const cx=W/2,cy=H/2;clr(c,W,H);
  [36,26,16].forEach((r,i)=>{circle(c,cx,cy,r,`hsl(${i===2?0:200+i*40},${i===2?90:80}%,${55+i*8}%)`,false,2)});
  const bx=cx+cos(t*1.5)*36,by=cy+sin(t*1.5)*36;circle(c,bx,by,5,'#f59e0b',true);
}
function flat_grid_pulse(c,t,W,H){
  clr(c,W,H);const g=20,cols=Math.ceil(W/g)+1,rows=Math.ceil(H/g)+1;
  for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){
    const d=sqrt((col-cols/2)**2+(r-rows/2)**2);
    const v=sin(d*.5-t*3)*.5+.5;
    c.fillStyle=`rgba(59,130,246,${v*.4})`;c.fillRect(col*g,r*g,g-1,g-1);
  }
}
function flat_badge(c,t,W,H){
  const cx=W/2,cy=H/2,p=sin(t*1.5)*.5+.5;clr(c,W,H);
  ngon(c,cx,cy,40+p*4,8,t*.2,'#1d4ed8',true,0);
  ngon(c,cx,cy,30+p*3,8,t*.2+PI/8,'#2563eb',true,0);
  circle(c,cx,cy,16+p*2,'#60a5fa',true);
}
function flat_arrow_loop(c,t,W,H){
  const cx=W/2,cy=H/2;clr(c,W,H);
  const arrows=4;for(let i=0;i<arrows;i++){const a=i/arrows*TAU+t;const x=cx+cos(a)*30,y=cy+sin(a)*30;c.save();c.translate(x,y);c.rotate(a+PI/2);c.beginPath();c.moveTo(0,-8);c.lineTo(7,4);c.lineTo(-7,4);c.closePath();c.fillStyle=`hsl(${200+i*40},85%,60%)`;c.fill();c.restore();}
  circle(c,cx,cy,10,'#1e3a5f',true);
}
function flat_infinity(c,t,W,H){
  const cx=W/2,cy=H/2;clr(c,W,H);
  const r=20;c.beginPath();
  for(let i=0;i<=200;i++){const a=i/200*TAU;const x=cx+r*sqrt(2)*cos(a)/(sin(a)**2+1);const y=cy+r*sqrt(2)*cos(a)*sin(a)/(sin(a)**2+1);i===0?c.moveTo(x,y):c.lineTo(x,y);}
  c.strokeStyle='#60a5fa';c.lineWidth=4;c.stroke();
  const a2=t*2,px=cx+r*sqrt(2)*cos(a2)/(sin(a2)**2+1),py=cy+r*sqrt(2)*cos(a2)*sin(a2)/(sin(a2)**2+1);
  circle(c,px,py,6,'#f59e0b',true);
}

/* ────── 2D (18) ────── */
function d2_orbit(c,t,W,H){
  const cx=W/2,cy=H/2;clr(c,W,H);
  circle(c,cx,cy,12,'#fbbf24',true);
  [[30,1.2,7,'#60a5fa'],[48,.7,5,'#a78bfa'],[64,.4,6,'#34d399']].forEach(([r,sp,sz,col])=>{

  clr(c,W,H);const cx=W/2,cy=H/2,cs=11,gap=1.5,ry=t*.5,rx=t*.3;
  const colors=['#ef4444','#3b82f6','#22c55e','#fbbf24','#f97316','#a78bfa'];
  for(let face=0;face<6;face++){
    const R=cs*3+gap*2;
    for(let r=0;r<3;r++)for(let col=0;col<3;col++){
      let x=(col-(1))*((cs+gap)),y=(r-1)*((cs+gap)),z=0;
      if(face===0)z=R/2;else if(face===1){z=-R/2;x=-x;}else if(face===2){const tmp=z;z=-x;x=R/2;}else if(face===3){const tmp=z;z=x;x=-R/2;}else if(face===4){const tmp=z;z=y;y=-R/2;}else{const tmp=z;z=-y;y=R/2;}
      const y2=y*cos(rx)-z*sin(rx),z2=y*sin(rx)+z*cos(rx);const x3=x*cos(ry)+z2*sin(ry),z3=-x*sin(ry)+z2*cos(ry);if(z3>8)continue;const sc=200/(200+z3);
      const px=cx+x3*sc,py=cy+y2*sc,ss=(cs-.5)*sc;
      c.fillStyle=colors[face];c.fillRect(px-ss/2,py-ss/2,ss,ss);c.strokeStyle='#0005';c.lineWidth=1;c.strokeRect(px-ss/2,py-ss/2,ss,ss);
    }
  }
}

// DRAW HELPERS
// ══════════════════════════════════════════════════════
function clr(c,W,H){c.clearRect(0,0,W,H);}
function circle(c,x,y,r,col,fill,lw=2){c.beginPath();c.arc(x,y,r,0,TAU);if(fill){c.fillStyle=col;c.fill();}else{c.strokeStyle=col;c.lineWidth=lw;c.stroke();}}
function ngon(c,cx,cy,r,n,rot,col,fill,lw){c.beginPath();for(let i=0;i<n;i++){const a=i/n*TAU+rot;i===0?c.moveTo(cx+cos(a)*r,cy+sin(a)*r):c.lineTo(cx+cos(a)*r,cy+sin(a)*r);}c.closePath();if(fill){c.fillStyle=col;c.fill();}else{c.strokeStyle=col;c.lineWidth=lw||2;c.stroke();}}
function arc(c,cx,cy,r,a1,a2,col,lw){c.beginPath();c.arc(cx,cy,r,a1,a2);c.strokeStyle=col;c.lineWidth=lw||2;c.stroke();}

function buildGrid(){
  const container=document.getElementById('animContainer');
  container.innerHTML='';
  const cats={flat:'Flat Design',d2:'Animation 2D',d3:'3D'};
  ['flat','2d','3d'].forEach(cat=>{
    const label=document.createElement('div');label.className='cat-label';
    label.textContent=cat==='flat'?'Flat Design':cat==='2d'?'Animation 2D':'3D';
    container.appendChild(label);
    const grid=document.createElement('div');grid.className='anim-grid';
    ANIMS.filter(a=>a.cat===cat).forEach(a=>{
      const card=document.createElement('div');card.className='anim-card'+(S.logoAnim===a.id?' sel':'');card.dataset.id=a.id;
      const cv=document.createElement('canvas');cv.width=46;cv.height=46;cv.id='prev-'+a.id;
      const sp=document.createElement('span');sp.textContent=a.label;
      card.appendChild(cv);card.appendChild(sp);
      card.onclick=()=>{S.logoAnim=a.id;document.querySelectorAll('.anim-card').forEach(c=>c.classList.remove('sel'));card.classList.add('sel');};
      grid.appendChild(card);
    });
    container.appendChild(grid);
  });
  // animate previews
  function animPrev(ts){
    const t=ts/1000;
    ANIMS.forEach(a=>{
      const cv=document.getElementById('prev-'+a.id);if(!cv)return;
      const c2=cv.getContext('2d');c2.fillStyle='#0a0a0a';c2.fillRect(0,0,46,46);
      try{a.fn(c2,t,46,46);}catch(e){}
    });
    requestAnimationFrame(animPrev);
  }
  requestAnimationFrame(animPrev);
}

// ══════════════════════════════════════════════════════
// MAIN DRAW LOOP
// ══════════════════════════════════════════════════════
function drawFrame(ts){
  const dt=Math.min((ts-S.lastTS)/1000,.1);S.lastTS=ts;
  S.fpsA+=dt;S.fpsN++;if(S.fpsA>=1){document.getElementById('fpsLabel').textContent=S.fpsN+' fps';S.fpsA=0;S.fpsN=0;}
  if(S.playing){S.t+=dt;S.frame++;}
  const W=C.width,H=C.height,t=S.t;

  // BG
  drawBG(W,H,t);

  // LOGO ANIM — centré, mis à l'échelle
  const la=ANIMS.find(a=>a.id===S.logoAnim);
  if(la){
    ctx.save();
    const sc=Math.min(W,H)/120;
    ctx.translate(W/2-W/2*sc,H/2-H/2*sc);ctx.scale(sc,sc);
    try{la.fn(ctx,t,W,H);}catch(e){}
    ctx.restore();
  }

  // USER IMAGE
  drawUserImg(W,H,t);
  // TEXT
  drawTxt(W,H,t);
  // OVERLAYS
  drawOverlays(W,H,t);
  // VIGNETTE
  const v=parseFloat(document.getElementById('vigAmt').value);
  if(v>0){const g=ctx.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,H*.8);g.addColorStop(0,'transparent');g.addColorStop(1,`rgba(0,0,0,${v})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  // TIMECODE
  const mm=Math.floor(t/60).toString().padStart(2,'0'),ss=Math.floor(t%60).toString().padStart(2,'0'),ff=Math.floor((t%1)*60).toString().padStart(2,'0');
  document.getElementById('timecodeBox').textContent=`${mm}:${ss}:${ff}`;
  if(S.frame%30===0)updateThumbs();
  requestAnimationFrame(drawFrame);
}

function drawBG(W,H,t){
  const c1=document.getElementById('bgColor').value,c2=document.getElementById('bg2Color').value;
  switch(S.bgType){
    case 'solid':ctx.fillStyle=c1;ctx.fillRect(0,0,W,H);break;
    case 'gradient':{const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);break;}
    case 'grid':ctx.fillStyle=c1;ctx.fillRect(0,0,W,H);ctx.strokeStyle=c2+'55';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}break;
    case 'dots':ctx.fillStyle=c1;ctx.fillRect(0,0,W,H);ctx.fillStyle=c2+'88';for(let x=20;x<W;x+=40)for(let y=20;y<H;y+=40){ctx.beginPath();ctx.arc(x,y,2,0,TAU);ctx.fill();}break;
    case 'particles':ctx.fillStyle=c1;ctx.fillRect(0,0,W,H);if(!S._pts){S._pts=[];for(let i=0;i<80;i++)S._pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,h:Math.random()*360});}S._pts.forEach(p=>{p.x=(p.x+p.vx+W)%W;p.y=(p.y+p.vy+H)%H;ctx.beginPath();ctx.arc(p.x,p.y,2,0,TAU);ctx.fillStyle=`hsla(${p.h},80%,60%,.5)`;ctx.fill();});break;
    case 'waves':ctx.fillStyle=c1;ctx.fillRect(0,0,W,H);for(let i=0;i<5;i++){ctx.beginPath();for(let x=0;x<=W;x+=4){const y=H/2+sin(x/100+t+i*.7)*(40+i*20);x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.strokeStyle=`hsla(${200+i*15},80%,55%,.18)`;ctx.lineWidth=2;ctx.stroke();}break;
  }
}

function drawUserImg(W,H,t){
  if(!S.imgObj)return;
  const ix=parseFloat(document.getElementById('imgX').value)/100*W;
  const iy=parseFloat(document.getElementById('imgY').value)/100*H;
  const sc=parseFloat(document.getElementById('imgScale').value)/100;
  let rot=parseFloat(document.getElementById('imgRot').value)*PI/180;
  let dx=0,dy=0,sc2=sc;
  switch(document.getElementById('imgAnim').value){
    case 'spin':rot+=t*1.5;break;case 'float':dy=sin(t*1.5)*12;break;
    case 'pulse':sc2=sc*(1+sin(t*2)*.08);break;case 'bounce':dy=abs(sin(t*2))*-20;break;
    case 'shake':dx=(Math.random()-.5)*6;break;
  }
  const iw=S.imgObj.width*sc2,ih=S.imgObj.height*sc2;
  ctx.save();ctx.translate(ix+dx,iy+dy);ctx.rotate(rot);ctx.drawImage(S.imgObj,-iw/2,-ih/2,iw,ih);ctx.restore();
}

function drawTxt(W,H,t){
  const txt=document.getElementById('txtContent').value;if(!txt)return;
  const font=document.getElementById('txtFont').value;
  const size=parseFloat(document.getElementById('txtSize').value);
  const col=document.getElementById('txtColor').value;
  const tx=parseFloat(document.getElementById('txtX').value)/100*W;
  const ty=parseFloat(document.getElementById('txtY').value)/100*H;
  const anim=document.getElementById('txtAnim').value;
  ctx.save();ctx.font=`bold ${size}px "${font}"`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.7)';ctx.shadowBlur=10;
  switch(anim){
    case 'none':ctx.fillStyle=col;ctx.fillText(txt,tx,ty);break;
    case 'typewriter':{const n=Math.floor(((t*.8)%1)*txt.length);ctx.fillStyle=col;ctx.fillText(txt.slice(0,n),tx,ty);break;}
    case 'wave':{ctx.textAlign='left';const tw=ctx.measureText(txt).width;[...txt].forEach((ch,i)=>{const cx2=tx-tw/2+ctx.measureText(txt.slice(0,i)).width;ctx.fillStyle=col;ctx.fillText(ch,cx2,ty+sin(t*2+i*.5)*14);});break;}
    case 'glitch':['rgba(255,0,0,.6)','rgba(0,255,255,.6)',col].forEach((co,i)=>{ctx.fillStyle=co;ctx.fillText(txt,tx+(i===0?sin(t*5)*6:i===1?cos(t*4)*-5:0),ty+(i===0?2:0));});break;
    case 'rainbow':{ctx.textAlign='left';const tw2=ctx.measureText(txt).width;[...txt].forEach((ch,i)=>{ctx.fillStyle=`hsl(${(i/txt.length*360+t*60)%360},100%,65%)`;ctx.fillText(ch,tx-tw2/2+ctx.measureText(txt.slice(0,i)).width,ty);});break;}
    case 'neon':for(let r=12;r>=0;r--){ctx.shadowColor=col;ctx.shadowBlur=r*4;ctx.fillStyle=r===0?col:`rgba(255,255,255,${.03*(12-r)})`;ctx.fillText(txt,tx,ty);}break;
  }
  ctx.restore();
}

function drawOverlays(W,H,t){
  if(S.fx.snow){if(S.snow.length<150)S.snow.push({x:Math.random()*W,y:-5,s:Math.random()*3+1,sp:Math.random()+.3});S.snow.forEach((p,i)=>{p.y+=p.sp;p.x+=sin(t+i)*.3;if(p.y>H+10)p.y=-5;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,TAU);ctx.fillStyle='rgba(255,255,255,.75)';ctx.fill();});}
  if(S.fx.rain){if(S.rain.length<300)S.rain.push({x:Math.random()*W,y:Math.random()*H,sp:Math.random()*6+6,l:Math.random()*12+8});ctx.strokeStyle='rgba(150,190,255,.35)';ctx.lineWidth=1;S.rain.forEach(p=>{p.y+=p.sp;if(p.y>H+20)p.y=-20;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+p.l*.2,p.y+p.l);ctx.stroke();});}
  if(S.fx.sparks){if(S.frame%3===0)for(let i=0;i<3;i++)S.sparks.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4-1,life:1,h:Math.random()*60+30});S.sparks.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.life-=.025;if(p.life<=0){S.sparks.splice(i,1);return;}ctx.beginPath();ctx.arc(p.x,p.y,2,0,TAU);ctx.fillStyle=`hsla(${p.h},100%,70%,${p.life})`;ctx.fill();});}
  if(S.fx.fireworks){if(S.frame%40===0){const fw={x:Math.random()*W*.8+W*.1,y:Math.random()*H*.5,ps:[],h:Math.random()*360};for(let i=0;i<50;i++){const a=Math.random()*TAU,sp=Math.random()*4+2;fw.ps.push({x:fw.x,y:fw.y,vx:cos(a)*sp,vy:sin(a)*sp,life:1});}S.fireworks.push(fw);}S.fireworks.forEach((fw,fi)=>{fw.ps.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.life-=.018;if(p.life<=0){fw.ps.splice(i,1);return;}ctx.beginPath();ctx.arc(p.x,p.y,2,0,TAU);ctx.fillStyle=`hsla(${fw.h},100%,70%,${p.life})`;ctx.fill();});if(fw.ps.length===0)S.fireworks.splice(fi,1);});}
  if(S.fx.lens){S.lensX=(S.lensX+1.5)%W;const lcy=H*(.3+sin(t*.4)*.1);const g=ctx.createRadialGradient(S.lensX,lcy,0,S.lensX,lcy,80);g.addColorStop(0,'rgba(255,255,255,.18)');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
}

function toggleFX(k,btn){S.fx[k]=!S.fx[k];btn.classList.toggle('on',S.fx[k]);}
function clearFX(){Object.keys(S.fx).forEach(k=>S.fx[k]=false);document.querySelectorAll('.sbtn').forEach(b=>b.classList.remove('on'));S.snow=[];S.rain=[];S.sparks=[];S.fireworks=[];}

function togglePlay(){S.playing=!S.playing;document.getElementById('playBtn').textContent=S.playing?'⏸ Pause':'▶ Lire';if(S.audioEl){S.playing?S.audioEl.play():S.audioEl.pause();}}

function loadAudio(input){
  const file=input.files[0];if(!file)return;
  const url=URL.createObjectURL(file);
  const el=document.createElement('audio');el.controls=true;el.src=url;el.style.cssText='width:100%;margin-top:6px';
  document.getElementById('audioPlayer').innerHTML='';document.getElementById('audioPlayer').appendChild(el);S.audioEl=el;
  el.volume=parseFloat(document.getElementById('volRange').value);
  try{if(!S.audioCtx)S.audioCtx=new(window.AudioContext||window.webkitAudioContext)();const src=S.audioCtx.createMediaElementSource(el);S.analyser=S.audioCtx.createAnalyser();S.analyser.fftSize=32;src.connect(S.analyser);S.analyser.connect(S.audioCtx.destination);startMeter();}catch(e){}
}

function startMeter(){
  const m=document.getElementById('meter');m.innerHTML='';const bars=[];
  for(let i=0;i<12;i++){const b=document.createElement('div');b.className='mbar';b.style.height='2px';m.appendChild(b);bars.push(b);}
  function tick(){if(!S.analyser){requestAnimationFrame(tick);return;}const d=new Uint8Array(S.analyser.frequencyBinCount);S.analyser.getByteFrequencyData(d);bars.forEach((b,i)=>{const v=d[Math.floor(i*d.length/bars.length)]/255;b.style.height=(v*26+2)+'px';b.style.background=v>.8?'#ef4444':v>.5?'#f59e0b':'#22c55e';});requestAnimationFrame(tick);}
  requestAnimationFrame(tick);
}

function loadImg(input){const file=input.files[0];if(!file)return;const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{S.imgObj=img;document.getElementById('imgControls').style.display='block';};img.src=e.target.result;};r.readAsDataURL(file);}

function addScene(){
  const id=Date.now();S.scenes.push(id);
  const card=document.createElement('div');card.className='scene-card';card.id='sc'+id;
  const cv=document.createElement('canvas');cv.width=110;cv.height=62;cv.id='sct'+id;
  const lbl=document.createElement('div');lbl.className='scene-label';lbl.textContent='Scène '+(S.scenes.length);
  const del=document.createElement('div');del.className='scene-del';del.textContent='✕';del.onclick=e=>{e.stopPropagation();card.remove();S.scenes=S.scenes.filter(s=>s!==id);};
  card.appendChild(cv);card.appendChild(lbl);card.appendChild(del);
  card.onclick=()=>{document.querySelectorAll('.scene-card').forEach(c=>c.classList.remove('active'));card.classList.add('active');};
  document.getElementById('scenesStrip').insertBefore(card,document.querySelector('.add-scene-btn'));
  card.click();
}

function updateThumbs(){document.querySelectorAll('[id^="sct"]').forEach(cv=>{const c2=cv.getContext('2d');c2.drawImage(C,0,0,cv.width,cv.height);});}

function exportPNG(){const a=document.createElement('a');a.download='novamotion.png';a.href=C.toDataURL('image/png');a.click();}
function exportWEBM(){
  S.recChunks=[];
  
  // Piste vidéo depuis le canvas
  const videoStream = C.captureStream(60);
  
  // Piste audio : on récupère la destination de l'AudioContext
  let combinedStream = videoStream;
  if(S.audioCtx && S.audioEl){
    try{
      const dest = S.audioCtx.createMediaStreamDestination();
      // Reconnecte l'analyser vers la destination d'enregistrement aussi
      S.analyser.connect(dest);
      const audioTrack = dest.stream.getAudioTracks()[0];
      if(audioTrack){
        combinedStream = new MediaStream([
          ...videoStream.getVideoTracks(),
          audioTrack
        ]);
      }
    }catch(e){ console.warn('Audio capture failed:', e); }
  }

  const types=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'video/webm';
  S.mediaRec=new MediaRecorder(combinedStream,{mimeType:mime});
  S.mediaRec.ondataavailable=e=>{if(e.data.size>0)S.recChunks.push(e.data);};
  S.mediaRec.onstop=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(S.recChunks,{type:mime}));
    a.download='novamotion.webm';a.click();
    document.getElementById('recBtn').classList.remove('active');
    document.getElementById('recBtn').textContent='⏺ REC';
    S.recording=false;
  };
  S.mediaRec.start(100);S.recording=true;
  document.getElementById('recBtn').classList.add('active');
  document.getElementById('recBtn').textContent='■ Stop';
  if(!S.playing)togglePlay();
}
}
function toggleRec(){if(!S.recording)exportWEBM();else S.mediaRec?.stop();}
function setRes(v){const[w,h]=v.split(',').map(Number);C.width=w;C.height=h;}

// INIT
buildGrid();
addScene();addScene();
requestAnimationFrame(ts=>{S.lastTS=ts;drawFrame(ts);});
